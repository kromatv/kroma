[workspace]

[package]
name = "__CRATE__"
version = "__VERSION__"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[[bin]]
name = "kroma-module-__SLUG__"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "__SDK_CRATES__/kroma-module-sdk"__SDK_FEATURES__ }
kroma-module-runtime = { path = "__SDK_CRATES__/kroma-module-runtime"__RUNTIME_FEATURES__ }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
kroma-module-sdk = { path = "__SDK_CRATES__/kroma-module-sdk", features = ["testing"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "form", "matched-path"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
debug = "line-tables-only"
