[workspace]

[package]
name = "__CRATE__"
version = "__VERSION__"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "kroma-module-__SLUG__"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "__SDK_CRATES__/kroma-module-sdk"__SDK_FEATURES__ }
kroma-module-runtime = { path = "__SDK_CRATES__/kroma-module-runtime"__RUNTIME_FEATURES__ }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
kroma-module-sdk = { path = "__SDK_CRATES__/kroma-module-sdk", features = ["testing"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
debug = "line-tables-only"
