plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lanreach'
version = '0.1.0'

android {
  namespace "expo.modules.lanreach"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// No dependencies: the TLS socket, the datagram and org.json are part of the
// platform, and the few WebSocket frames this needs are written by hand.
