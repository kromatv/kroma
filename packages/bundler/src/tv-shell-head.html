<!-- The stage's ground, injected into every TV shell's document by
     @kroma/bundler tv-shell-head.ts. It is in the document rather than in the
     bundle so the panel is black from the very first frame, before any script
     loads, and a launch never flashes a white body. One copy: the two packaged
     shells (Tizen, webOS) need their own entry document, but not their own
     copy of what that document says. -->
<style>
  html,
  body,
  #root {
    height: 100%;
  }
  html,
  body {
    margin: 0;
    background: #0a0a0c;
    color-scheme: dark;
  }
  body {
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
</style>
