[package]
name = "kroma-webpush"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Web Push message encryption (RFC 8291) + VAPID request signing (RFC 8292). Pure crypto: builds the request, never sends it."
license.workspace = true

# Pure-Rust RustCrypto primitives, in keeping with the musl single-binary build.
# This crate does NO I/O: it hands back a URL + headers + body, and the caller
# sends it with `kroma-http` (curl). That keeps the crypto unit-testable against
# the RFC vectors without a network or a subprocess.
[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
hkdf = "0.12"
aes-gcm = "0.10"
# `ecdh` for the message key agreement (RFC 8291), `ecdsa` for the VAPID JWT
# signature (RFC 8292). Both halves of Web Push are P-256.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
