[package]
name = "kroma-wasm-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Runs a module as a WebAssembly component: wasmtime, a small WIT world, a WASI context holding only what its grant names (raw sockets included, each use ruled), and a memory ceiling and CPU budget per instance."
license.workspace = true

[dependencies]
wasmtime = { version = "50.0.3", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "50.0.3", default-features = false, features = ["p2"] }
wasmparser = { version = "0.261.0", default-features = false, features = ["component-model", "std"] }
thiserror = "2"
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
socket2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
axum = { workspace = true }
kroma-http = { workspace = true }
kroma-testing = { workspace = true }
