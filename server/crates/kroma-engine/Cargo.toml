[package]
name = "kroma-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "KROMA business logic: infra adapters + services + app state (everything the HTTP layer drives)"
license.workspace = true

[features]
# `services::sso::testing`: a provider to sign in against and the keys it signs
# with. Off by default so nothing of it reaches a release build.
testing = []

[[example]]
name = "sso_provider"
required-features = ["testing"]

[dependencies]
# Lower layers (aliased inside lib.rs as crate::{db,config,domain}).
kroma-domain = { workspace = true }
kroma-db = { workspace = true }
kroma-config = { workspace = true }
kroma-primitives = { workspace = true }
kroma-i18n = { workspace = true }
# Module registry contract + the module descriptors from the leaf crates.
semver = "1"
# `storage` unconditionally: the engine IS the core database.
kroma-module-host = { workspace = true, features = ["storage"] }
kroma-module-manifest = { workspace = true }
kroma-http = { workspace = true }
kroma-push = { workspace = true }
# The request and monitoring workflows and the TMDB lookups under them, re-exported
# under `services::` and `infra::metadata`. A module runs the same code.
kroma-requests = { workspace = true }
# ffprobe, the ffmpeg budget and the HLS engine, re-exported under `infra::`.
kroma-media = { workspace = true }
# The heavy/optional adapters (embeddings, whisper transcription, mDNS) are no
# longer named here: the engine consumes them through the port traits in
# `crate::ports`, and the binary (composition root) wraps the concrete module
# crates into those ports and injects them. kroma-engine names ZERO module crates.

axum = { workspace = true }
tokio = { workspace = true }
# Account email (credential reset, address verification) via the operator's SMTP.
lettre = { workspace = true }
# The server's identity at the mail relay: a P-256 key that signs every call.
p256 = { version = "0.13", features = ["ecdsa"] }
# RS256, the algorithm every OpenID Connect provider signs ID tokens with.
rsa = { version = "0.9", features = ["sha2"] }
# The authorize URL's query and the token endpoint's client credentials.
form_urlencoded = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
walkdir = { workspace = true }
jwalk = { workspace = true }
chacha20poly1305 = { workspace = true }
zip = { workspace = true }
tar = "0.4"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }
notify = { workspace = true }
sysinfo = { workspace = true }
tantivy = { workspace = true }
rusty-chromaprint = { workspace = true }
# The interfaces and addresses this machine holds, for the direct LAN route.
if-addrs = "0.15"

[dev-dependencies]
# The shared HostCtx doubles: `testing::Recording` taps a real app host's bus,
# `testing::StubHost` stands in where there is no app at all.
kroma-module-host = { workspace = true, features = ["testing"] }
# `db::testing::temp_pool`, the throwaway database the service tests run against.
kroma-db = { workspace = true, features = ["testing"] }
# `testing::FakeTmdb`, and the base override it needs.
kroma-requests = { workspace = true, features = ["testing"] }
kroma-testing = { workspace = true }
# `test-util` gives the runtime a clock a test can advance, so the loops that
# sleep between sweeps are reachable without waiting out their interval.
tokio = { workspace = true, features = ["test-util"] }
# The encoder builds the xz payload of a test server package.
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz", "encoder"] }
