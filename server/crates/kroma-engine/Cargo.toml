[package]
name = "kroma-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "KROMA business logic: infra adapters + services + app state (everything the HTTP layer drives)"
license.workspace = true

[dependencies]
# Lower layers (aliased inside lib.rs as crate::{db,config,domain}).
kroma-domain = { workspace = true }
kroma-db = { workspace = true }
kroma-config = { workspace = true }
kroma-primitives = { workspace = true }
kroma-i18n = { workspace = true }
# Module registry contract + the module descriptors from the leaf crates.
kroma-module-manifest = { workspace = true }
kroma-module-host = { workspace = true }
kroma-http = { workspace = true }
kroma-push = { workspace = true }
# The heavy/optional adapters (embeddings, whisper transcription, mDNS) are no
# longer named here: the engine consumes them through the port traits in
# `crate::ports`, and the binary (composition root) wraps the concrete module
# crates into those ports and injects them. kroma-engine names ZERO module crates.

axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# The storyboard hwaccel probe writes a throwaway frame; a guard removes it even
# when the decode fails and the probe returns early.
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
walkdir = { workspace = true }
jwalk = { workspace = true }
chacha20poly1305 = { workspace = true }
zip = { workspace = true }
notify = { workspace = true }
sysinfo = { workspace = true }
tantivy = { workspace = true }
rusty-chromaprint = { workspace = true }

[dev-dependencies]
# The shared HostCtx doubles: `testing::Recording` taps a real app host's bus,
# `testing::StubHost` stands in where there is no app at all.
kroma-module-host = { workspace = true, features = ["testing"] }
# `db::testing::temp_pool`, the throwaway database the service tests run against.
kroma-db = { workspace = true, features = ["testing"] }
kroma-testing = { workspace = true }
# `test-util` gives the runtime a clock a test can advance, so the loops that
# sleep between sweeps are reachable without waiting out their interval.
tokio = { workspace = true, features = ["test-util"] }
