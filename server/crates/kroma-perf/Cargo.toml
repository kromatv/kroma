[package]
name = "kroma-perf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Measures every request, job, SQLite statement and instrumented function a process runs, attributes each to what ran it, and keeps what it measured."
license.workspace = true

# No module links this crate, and it names nothing of KROMA: it knows scopes
# (a request, a job), the segments they spend time in, and SQLite.
[dependencies]
anyhow = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
twox-hash = { workspace = true }

[dev-dependencies]
kroma-testing = { workspace = true }
