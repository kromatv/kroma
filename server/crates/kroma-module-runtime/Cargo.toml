[package]
name = "kroma-module-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The out-of-process module runtime: each module ships as its own native binary that opens the shared SQLite, serves its routes on a local port, and reaches the host over a small IPC. `serve(...)` is the whole main()."
license.workspace = true

[features]
# The `storage` capability: the module's own database plus the scoped core one.
# Off by default -- a module that declares no storage must not link `kroma-db`,
# and it is `kroma-db` that drags the bundled SQLite amalgamation into a sidecar.
storage = ["dep:kroma-db", "kroma-module-host/storage"]

[dependencies]
# The host contract the module code is written against (HostCtx / ServerModule /
# Event / AuthUser) + the DI seam. This is the ONLY module-facing dep in common
# with the in-process path, so the same route code runs behind the remote host.
kroma-module-host = { workspace = true }
# Only under `storage`: the module's own database, and the core one behind the
# grant its manifest declared. WAL is multi-process, so both are opened here
# rather than proxied.
kroma-db = { workspace = true, optional = true }
# User / Permission for local require() checks.
kroma-domain = { workspace = true }
kroma-http = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
