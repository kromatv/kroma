[package]
name = "kroma-module-supervisor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The core side of the out-of-process module system: spawn + supervise each installed module binary, reverse-proxy its HTTP, and serve the /api/_host/* callback API modules use for settings / events / jobs."
license.workspace = true

[dependencies]
# The host contract the callback endpoints resolve against (any HostCtx state).
kroma-module-host = { workspace = true }
kroma-module-manifest = { workspace = true }
# The `User` the session callback answers with.
kroma-domain = { workspace = true }
# Moving a module's tables out of the core database, before it is spawned.
kroma-db = { workspace = true }
rusqlite = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
# Async client: reverse-proxy to module processes on localhost + fetch .kmod /
# catalog.json from a registry over https (rustls keeps the musl build C-free).
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rand = "0.10"
# Unpacking installed .kmod bundles (gzip tar of module.json + module + fe/ + icon).
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust zstd decoder for the (smaller) zstd `.kmod` bundles. Decompress-only +
# no C, so the musl single binary keeps linking; install is one-shot so its
# throughput doesn't matter.
ruzstd = "0.7"
# Verify a downloaded .kmod against its catalog sha256 before installing.
sha2 = { workspace = true }
hex = { workspace = true }

# SIGTERM to a sidecar so it can run its shutdown hooks before being killed.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The install/stop tests scratch in a directory that removes itself.
kroma-testing = { workspace = true }
# The `StubHost` double the session-callback test answers from.
kroma-module-host = { workspace = true, features = ["testing"] }
kroma-domain = { workspace = true }
# `oneshot`, to drive the callback router without binding a port.
tower = { workspace = true }
