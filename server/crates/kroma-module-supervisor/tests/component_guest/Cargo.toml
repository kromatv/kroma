[package]
name = "kroma-component-guest"
version = "0.0.0"
edition = "2021"
publish = false
description = "A misbehaving module the supervisor's component tests build for wasm32-wasip2."
license = "AGPL-3.0-or-later"

[[bin]]
name = "module"
path = "src/bin/module.rs"

[dependencies]
kroma-module-runtime = { path = "../../../kroma-module-runtime", features = ["storage"] }
kroma-module-sdk = { path = "../../../kroma-module-sdk", features = ["storage"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "form", "matched-path"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }
wasip2 = "1"

# Its own workspace: it builds for wasm32-wasip2 only, never as a member of server/.
[workspace]

[profile.release]
opt-level = "s"
