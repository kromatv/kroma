[package]
name = "kroma-module-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The host seam: the narrow HostCtx contract + shared HTTP extractors a module crate's backend needs, without depending on the whole app (kroma-engine)."
license.workspace = true

[features]
# Compiles `testing::{StubHost, Recording}`, the shared HostCtx doubles. Off by
# default so nothing reaches a release build; crates that test against the seam
# turn it on in their dev-dependencies.
testing = ["dep:kroma-testing"]

[dependencies]
kroma-domain = { workspace = true }
kroma-db = { workspace = true }
# Sync curl client for the consumer-side port proxies (port methods are sync).
kroma-http = { workspace = true }
kroma-testing = { workspace = true, optional = true }
axum = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `oneshot`, to drive the host-token guard without binding a port.
tower = { workspace = true }
tokio = { workspace = true }
# `db::testing::temp_pool` for the pool-handling tests, and the scratch dir the
# `testing` module hands every StubHost (its own feature cannot switch itself on).
kroma-db = { workspace = true, features = ["testing"] }
kroma-testing = { workspace = true }
