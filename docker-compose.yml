# KROMA server. Step-by-step guide: docs/setup/docker.md
#
# Before the first start:
#   mkdir -p data        create it yourself, or Docker creates it for root
#   id -u && id -g       your user and group IDs, for the `user:` line
#
# Then: docker compose up -d, and open http://SERVER_IP:4040
services:
  kroma:
    image: ghcr.io/kromatv/kroma:latest
    container_name: kroma
    restart: unless-stopped
    # The files KROMA writes in your media folder belong to this user.
    user: "1000:1000"
    ports:
      - "4040:4040"
      # - "4443:4443"   # HTTPS, with KROMA_HTTPS below
    # Intel graphics for video conversion: docs/setup/hardware-transcoding.md
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"          # getent group render | cut -d: -f3
    # environment:
    #   KROMA_HTTPS: "1"
    #   KROMA_TLS_SANS: "192.168.1.50"
    #   Every variable: docs/setup/configuration.md
    volumes:
      # ON_YOUR_COMPUTER:IN_THE_CONTAINER. Change the left side only.
      - ./data:/data
      # Your films and series. Add :ro at the end to forbid KROMA to write there.
      - /srv/media:/media
