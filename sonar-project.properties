# SonarCloud configuration for KROMA (maxscharwath_kroma).
#
# Read by the CI scanner (.github/workflows/sonar.yml). To activate CI-based
# analysis you must, in SonarCloud > Administration > Analysis Method, turn OFF
# "Automatic Analysis" and add a SONAR_TOKEN repository secret. Until then the
# repo keeps being scanned by Automatic Analysis, which honors the exclusions
# below but not coverage import.
sonar.projectKey=maxscharwath_kroma
sonar.organization=maxscharwath
sonar.sourceEncoding=UTF-8

# Analyzer inputs the scanner cannot infer, each one a warning in the log until
# it is stated.
#
# The Python is one build script (clients/tv-build/store-art.py, `#!/usr/bin/env
# python3`); without a version the analyzer hedges across every Python 3 and
# reports less.
sonar.python.version=3.10, 3.11, 3.12, 3.13
# The JS/TS analyzer's Node process hit its default 4 GB heap ceiling and died
# mid-analysis once the TS surface grew past it (main scan, 2026-07-31). The
# runner has 16 GB; give the analyzer half.
sonar.javascript.node.maxspace=8192
# Objective-C needs a compilation database, which this repo has no way to
# produce (the one .m is a macOS libmpv render shim built by cargo through
# Tauri). AutoConfig warns on every run otherwise; `-` turns the language off
# rather than leaving it half-analyzed.
sonar.objc.file.suffixes=-

# Scope the scanner to the trees that hold authored code, plus the analyzable
# root files, listed one per line. NOT `.`: exclusion patterns are applied per
# file AFTER the walk, so a `.` root made the scanner traverse node_modules and
# the cargo target dirs on every scan (6.7M files, 8+ min of "Preprocessing
# files..." in CI) only to discard them. The exclusions below still carve out
# generated/vendored/built subtrees inside these roots. A root file listed here
# that gets deleted fails the scan loudly; when one moves, this list moves too.
sonar.sources=\
  apps,\
  .github,\
  clients,\
  docs,\
  modules,\
  packages,\
  patches,\
  server,\
  biome.json,\
  docker-compose.yml,\
  knip.jsonc,\
  package.json,\
  tsconfig.base.json,\
  vitest.config.ts,\
  vitest.setup.ts
sonar.tests=apps,clients,modules,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Generated code, vendored caches, build output, lockfiles and runtime data are
# not authored here and must not be analyzed.
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/generated/**,\
  **/*.gen.ts,\
  packages/modules-generated/**,\
  server/crates/kroma-modules-generated/**,\
  clients/synology/.cache/**,\
  clients/web/src/routeTree.gen.ts,\
  packages/ui/audit/paint/**,\
  packages/ui/audit/a11y/**,\
  **/*.min.js,\
  **/vendor/**,\
  data/**,\
  **/*.lock,\
  bun.lock,\
  clients/desktop/src-tauri/src/window_shim.m,\
  **/*.png,\
  **/*.PNG,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.webp,\
  **/*.gif,\
  **/*.ico,\
  **/*.icns,\
  **/*.mp3,\
  **/*.mp4,\
  **/*.woff,\
  **/*.woff2,\
  **/*.ttf,\
  **/*.otf,\
  **/*.keystore,\
  **/*.p12

# Coverage (JS/TS via vitest v8 -> lcov; Rust via cargo-llvm-cov -> lcov).
# Missing report paths only warn, so a partial run never blocks the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.rust.lcov.reportPaths=server/lcov.info

# Glue that has no meaningful unit-test surface is excluded from the coverage
# denominator (still analyzed for issues, just not counted as "uncovered").
#
# Two entries below are the OPPOSITE case and are here for a different reason:
# clients/web/src/sw.ts and clients/tizen/src/preview-service.cts are covered by
# real behavioural tests (19 and 11 of them), but those tests compile the file and
# evaluate the bundle against a fake global, because neither a service worker nor
# a Tizen background service can be imported into a test process. Istanbul
# instruments the source, never the bundle, so it reports both as 0% no matter
# how much is exercised. Counting them would understate coverage, not protect it.
#
# The build and CLI entry points below are the same class as `scripts/**` and
# `packages/core/scripts/**` above: importing one parses `process.argv`, shells
# out to `gh` or `docker`, writes into `dist/`, or starts a server. There is no
# unit-test surface to reach without running the tool.
#
# A third case: modules/*/server/tests/live_*.rs are `#[ignore]`d end-to-end
# tests against real third-party services, run by hand when somebody wants to
# know whether an upstream schema has drifted. No CI job runs them, so no CI job
# can cover them, and counting them measures nothing about this codebase.
#
# A fourth: apps/kit/src/stories.ts hands Metro's injected `require.context` to
# `discoverMetro`, which nothing off Metro can call. Its consumer is covered
# against a fake context in packages/workbench.
#
# A fifth, which is not a judgement call at all: a declaration file emits no
# statement, so nothing can execute one and no report can ever name it covered.
# `**/*.d.ts` was always here; the ESM and CJS spellings join it because the
# bundler now types two of its own entry points that way
# (packages/bundler/src/mdx.d.mts, mdx-transformer.d.cts).
