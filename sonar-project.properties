# collide). Nothing is ever inserted, removed or reordered in any of these - a
# fixed grid row, an OTP slot, a snippet's line, a token in a line, a rich-text
# segment. Each site already carries the matching biome-ignore and the reasoning
# at the tag; this is the same reviewed call, told to the other analyzer.
sonar.issue.ignore.multicriteria.idxkeys.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.idxkeys.resourceKey=packages/**
# The showcase site, for exactly the same reason and with the same biome-ignore at each
# tag: the lines of a shell snippet, the steps of an install procedure, the answers in a
# FAQ, and the styled runs of one rich-text string (on a page, and on the social card).
# Every one is a fixed, authored list that is never inserted into, removed from or
# reordered, and whose CONTENT repeats (two identical lines in a snippet, the same word
# twice in a sentence), so keying by content would collide where keying by position cannot.
