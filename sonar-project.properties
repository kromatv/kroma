# Coverage-scope rationale: the lines above are genuinely-external or glue that a
# unit test can't meaningfully exercise: process-spawning + network + platform
# infra, module network/IO, the module runtime/supervisor, binary entry points,
# React view components (logic lives in separately-tested .ts), the axum HTTP
# handler test harness (it_*.rs / test_support.rs) + module HTTP routes + the
# specific handlers that require external resources a test can't provide (ffmpeg
# byte streams, websockets, image encoding, webauthn, TMDB/LLM/acquisition
# network, module sidecars, background jobs) - the REST of the HTTP handler layer
# is now covered by real in-process axum integration tests (src/api/it_*.rs).
# Also excluded: the ffmpeg/chromaprint marker fingerprinting, network-
# orchestration services
# (TMDB enrichment, the LLM tool loop, the acquisition module lib), and the
# view/platform-glue TS: React hooks (use*.ts, DOM/effect-bound).
#
# NOTE, because it caused a real regression: eight of these paths went stale when
# the universal-kit refactor moved the files (packages/ui/src/playback.ts ->
# src/services/playback.ts, src/player/audio-filter.ts ->
# src/components/organisms/player/lib/audio-filter.ts, and so on). An exclusion
# that matches nothing fails SILENTLY - the files simply reappeared in the
# denominator, and new-code coverage read 51% for work that had not changed its
# testability at all. When a file listed here moves, this list moves with it.
#
# The native module sources (Swift / Kotlin / Java under clients/tv-native) carry
# no coverage because this repo has no Swift or Kotlin test runner at all - there
# is no XCTest target and no androidTest source set - so counting them as
# "uncovered" measures the absence of a toolchain rather than the absence of
# tests. Same for the build/dev scripts (screenshot capture, cert minting, perf
# probes, the Expo config plugin): they spawn processes and drive devices. The
# native
# player-engine adapters (baseEngine transport / mpv IPC / Tizen AVPlay /
# ExoBridge / HTMLVideoElement / web video-engine) are now IN scope, covered by
# jsdom unit tests that mock each platform bridge (*Engine.test.ts, video-engine
# .test.ts). The DB, service/business logic, domain, parsers, SDK ports, port
# bridges, and the pure .ts logic (formatters, selection, matching, url builders)
# stay IN scope and are unit-tested.

# Duplication (copy/paste) detection exclusions. Test files legitimately repeat
# setup/fixtures, and the module verticals are INTENTIONALLY independent (the
# microkernel keeps 0 internal coupling): two torrent-engine backends and two
# provisioning flows that look similar must not be coupled into shared code.
sonar.cpd.exclusions=\
  **/tests.rs,\
  **/test_support.rs,\
  server/src/api/it_*.rs,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  server/modules/tv.kroma.engine.qbittorrent/server/src/lib.rs,\
  server/modules/tv.kroma.engine.transmission/server/src/lib.rs,\
  server/modules/tv.kroma.remote/server/src/provision.rs,\
  server/modules/tv.kroma.vpn/server/src/provision.rs,\
  clients/web/src/features/admin/naming-tokens.tsx,\
  server/crates/kroma-engine/src/services/pipeline/stages/*.rs

# ---------------------------------------------------------------------------
# Justified "won't fix" suppressions. Each is an intentional, reviewed choice;
# see the comment for why it is safe in this codebase. Prefer a code fix over a
# new entry here.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=md5spk,pathtool,rndsess,httplan,httptizen,httpph,httpdev,dockerroot,viewport,dlgrole,postercard,videoplane,avplayobj,nestbtnpipe,nestbtnreq,ghscripts,dkscripts,devecho,viteesbuild,playerbtn,settingsbtn,subre,playercplx,pipecplx,enginepreftv,engineprefweb,introcaption,idxkeys,certpath,certlog,buildargs,gradlelock,perflog,runonce,demotags,tvselectable,sheetcplx,shellcplx

# MD5 is the checksum field the Synology package-repo format mandates; integrity
# marker, never a security/crypto context.
# NOTE: a resourceKey that matches nothing fails SILENTLY - the suppression just
# stops applying and the issue comes back as if it had never been reviewed. Seven
# of the entries below pointed at pre-refactor paths (packages/ui/src/player/... ,
# src/playback.ts, components/PosterCard.tsx) and had quietly lapsed. When a file
# named here moves, this list moves with it.

sonar.issue.ignore.multicriteria.md5spk.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.md5spk.resourceKey=packages/synology-repo/src/spk.ts

# Build/catalog tooling resolving `tar`/`gh` via PATH; runs only in trusted
# dev/CI shells, and absolute paths would break macOS<->Linux portability.
sonar.issue.ignore.multicriteria.pathtool.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.pathtool.resourceKey=packages/synology-repo/src/**

# Non-crypto playback session id (Date.now + random suffix); collision-tolerant
# telemetry key, not a secret.
sonar.issue.ignore.multicriteria.rndsess.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.rndsess.resourceKey=packages/ui/src/services/playback.ts

# LAN discovery default: a self-hosted KROMA server on the local network speaks
# plain http (kroma.local:4040); there is no TLS to use.
sonar.issue.ignore.multicriteria.httplan.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.httplan.resourceKey=packages/core/src/discover.ts

# "http://tizen.org/appcontrol/..." is a Tizen platform operation identifier,
# not a network URL.
sonar.issue.ignore.multicriteria.httptizen.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.httptizen.resourceKey=packages/tv/src/shared/preview/service.ts

# Example placeholder text inside a form input (a LAN indexer URL); never fetched.
sonar.issue.ignore.multicriteria.httpph.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.httpph.resourceKey=server/modules/tv.kroma.indexer/ui/src/indexer-modals.tsx

# Dev-only HTML shell used against a local http dev server.
sonar.issue.ignore.multicriteria.httpdev.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.httpdev.resourceKey=clients/tizen/public/index.dev.html

# Self-hosted media server: containers bind-mount host media with arbitrary
# ownership and follow the PUID/PGID convention, so a hardcoded non-root USER
# would break volume access.
sonar.issue.ignore.multicriteria.dockerroot.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.dockerroot.resourceKey=server/Dockerfile*

# 10-foot TV / kiosk shells navigated by remote (or a fullscreen desktop app):
# pinch-zoom does not apply, and locking the viewport is intentional UX.
sonar.issue.ignore.multicriteria.viewport.ruleKey=Web:S7926
sonar.issue.ignore.multicriteria.viewport.resourceKey=clients/**/index*.html

# --- S6819 (aria role vs native element): keyboard a11y (role + tabIndex +
# Enter/Space onKeyDown) is already present in each of these; only the native
# element swap is declined, for a concrete, reviewed reason. ---

# Modal keeps role="dialog"+aria-modal: a native <dialog> carries UA styles
# (position/margin/color) that would shift this fixed, flex-centered, color-
# inheriting modal (wrong text color on the dark theme).
sonar.issue.ignore.multicriteria.dlgrole.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.dlgrole.resourceKey=packages/admin-kit/src/forms.tsx

# Shared poster card renders on Chromium-53 legacy TV webviews; swapping the
# styled div to a native <button> risks appearance regressions there.
sonar.issue.ignore.multicriteria.postercard.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.postercard.resourceKey=packages/ui/src/components/molecules/poster-card/poster-card.tsx

# role="img" sits on the transparent native video-plane div (mpv/ExoPlayer
# renders behind it); it has no image src to move to a native <img>.
sonar.issue.ignore.multicriteria.videoplane.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.videoplane.resourceKey=packages/tv/src/features/playback/player/PlayerSurface.web.tsx

# The role="button" span is nested INSIDE the row's own <button>; a native
# button cannot be nested in a button.
sonar.issue.ignore.multicriteria.nestbtnpipe.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.nestbtnpipe.resourceKey=clients/web/src/features/admin/pipeline-row.tsx
sonar.issue.ignore.multicriteria.nestbtnreq.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.nestbtnreq.resourceKey=clients/web/src/features/admin/request-row.tsx

# `bun install` runs from a frozen, integrity-checked lockfile; bun does not
# execute dependency lifecycle scripts by default (only the native toolchain
# packages the build needs), so forcing --ignore-scripts would break the build
# without adding safety.
sonar.issue.ignore.multicriteria.ghscripts.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.ghscripts.resourceKey=.github/workflows/*.yml

# Same for the Docker build: `npm install -g bun` relies on bun's own postinstall
# to fetch its binary, and `bun install` uses the frozen lockfile.
sonar.issue.ignore.multicriteria.dkscripts.ruleKey=docker:S6505
sonar.issue.ignore.multicriteria.dkscripts.resourceKey=server/Dockerfile

# Informational echo printing the LAN dev-server URL (the dev server is http on
# localhost by design); not a network call.
sonar.issue.ignore.multicriteria.devecho.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.devecho.resourceKey=clients/tizen/scripts/dev-device.sh

# Vite 8 marks the UserConfig['esbuild'] type @deprecated, but this is an
# intentional, documented console/debugger strip on production builds that still
# works at runtime; migrating away would drop the strip.
sonar.issue.ignore.multicriteria.viteesbuild.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.viteesbuild.resourceKey=clients/desktop/vite.config.ts

# Shared player chrome: role="button" wraps the <video> surface + subtitles +
# spinner (a native <button> cannot contain them) and renders more reliably on
# legacy TV webviews; keyboard a11y (tabIndex + Enter/Space onKeyDown) is present.
sonar.issue.ignore.multicriteria.playerbtn.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.playerbtn.resourceKey=packages/ui/src/components/organisms/player/Player.tsx
sonar.issue.ignore.multicriteria.settingsbtn.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.settingsbtn.resourceKey=packages/ui/src/components/organisms/player/parts/SettingsPanel.tsx

# `/<[^>]+>/g` cannot backtrack catastrophically: the negated class excludes the
# `>` terminator, so the quantifier never gives back characters to match it. It
# also runs only over trusted, bounded subtitle-cue text. False positive.
sonar.issue.ignore.multicriteria.subre.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.subre.resourceKey=packages/ui/src/components/organisms/player/parts/SubtitleRenderer.tsx

# Top-level composition-root components: the shared <Player> (web + legacy TV) and
# the admin PipelinePage already have their cohesive logic extracted into hooks/
# subcomponents; the residual complexity is inherent to wiring state + effects +
# child composition, and splitting further would fragment cohesive UI, not clarify.
sonar.issue.ignore.multicriteria.playercplx.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.playercplx.resourceKey=packages/ui/src/components/organisms/player/Player.tsx
sonar.issue.ignore.multicriteria.pipecplx.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.pipecplx.resourceKey=clients/web/src/features/admin/pipeline.tsx
# The same call, for the same reason, on the phone's track sheet and the
# workbench shell. Both have had their genuinely separable pieces taken out
# already - the sheet's menu is <SheetMenu>, its audio and subtitle labels are
# pure functions, the shell's screenshot mode is shotStage() and its canvas
# state is useStageView() - and what is left in each is one surface deciding
# which of its own views to show. Splitting that further means threading a
# dozen props into a component that exists only to satisfy a counter, which is
# the trade this block was written to refuse.
sonar.issue.ignore.multicriteria.sheetcplx.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.sheetcplx.resourceKey=clients/mobile/src/player/TrackSheet.tsx
sonar.issue.ignore.multicriteria.shellcplx.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.shellcplx.resourceKey=packages/workbench/src/workbench.tsx
# The AVPlay <object> intentionally carries NO child content (aria-label gives the
# accessible name): AVPlay renders to a hardware plane, so any fallback child would
# draw visibly over the video. See the comment at the tag.
sonar.issue.ignore.multicriteria.avplayobj.ruleKey=typescript:S5264
sonar.issue.ignore.multicriteria.avplayobj.resourceKey=packages/tv/src/features/playback/player/PlayerSurface.web.tsx
# The raw useState setter is deliberately `setEnginePrefState`: a `setEnginePref`
# wrapper (which also persists the pref) sits on top of it, so it cannot follow the
# set<Value> naming S6754 expects without colliding with the wrapper.
sonar.issue.ignore.multicriteria.enginepreftv.ruleKey=typescript:S6754
sonar.issue.ignore.multicriteria.enginepreftv.resourceKey=packages/tv/src/features/playback/player/useDirectPlayback.ts
sonar.issue.ignore.multicriteria.engineprefweb.ruleKey=typescript:S6754
sonar.issue.ignore.multicriteria.engineprefweb.resourceKey=clients/web/src/features/playback/use-video-playback.ts
# The brand intro is a 10s film with a musical sting and no speech, and IntroShell
# wraps it in a role="img" aria-label="KROMA" stage: ARIA makes every descendant
# presentational, so a caption track on that <video> could never be surfaced. An
# empty <track kind="captions"> carries no src to load, so it would only claim
# captions the film does not have. Same reviewed call as the biome-ignore at the tag.
sonar.issue.ignore.multicriteria.introcaption.ruleKey=typescript:S4084
sonar.issue.ignore.multicriteria.introcaption.resourceKey=packages/ui/src/components/organisms/kroma-intro/**

# Positional collections: the index IS the identity, so a synthetic key would be
# strictly worse (code lines and text segments repeat, so keying by content would
# collide). Nothing is ever inserted, removed or reordered in any of these - a
# fixed grid row, an OTP slot, a snippet's line, a token in a line, a rich-text
# segment. Each site already carries the matching biome-ignore and the reasoning
# at the tag; this is the same reviewed call, told to the other analyzer.
sonar.issue.ignore.multicriteria.idxkeys.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.idxkeys.resourceKey=packages/**

# Developer/CI tooling that shells out to known Apple and build binaries
# (security, openssl, xcrun, gradle, adb) on a machine the operator controls.
# S4036 is about PATH being attacker-writable, which is not a threat model that
# applies to a script you run on your own Mac to mint your own signing cert - the
# same reasoning as `pathtool` above. None of this ships in an app.
sonar.issue.ignore.multicriteria.certpath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.certpath.resourceKey=clients/desktop/scripts/**
sonar.issue.ignore.multicriteria.buildargs.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.buildargs.resourceKey=clients/tv-build/**

# The "user-controlled data" these log is the operator's own CLI argument, echoed
# back so the script says what it is doing. There is no other user.
sonar.issue.ignore.multicriteria.certlog.ruleKey=tssecurity:S5145
sonar.issue.ignore.multicriteria.certlog.resourceKey=clients/desktop/scripts/**
sonar.issue.ignore.multicriteria.perflog.ruleKey=tssecurity:S5145
sonar.issue.ignore.multicriteria.perflog.resourceKey=clients/tv-build/**

# The Android halves of the Expo native modules are generated from Expo's module
# template and are autolinked into the app's own Gradle build, which is where
# dependency resolution and locking actually happen. A lockfile per autolinked
# module would pin nothing the app build honours.
sonar.issue.ignore.multicriteria.gradlelock.ruleKey=text:S8569
sonar.issue.ignore.multicriteria.gradlelock.resourceKey=clients/tv-native/modules/**

# `useState(configureRemote)` with nothing destructured is the run-once idiom,
# not a forgotten binding: a lazy initializer runs during this component's first
# render, strictly before any child renders, and never again - which is exactly
# when the remote has to be configured. An effect would be too late (a child
# would already have mounted) and a module-level call too early. Stated at the
# call site too.
sonar.issue.ignore.multicriteria.runonce.ruleKey=typescript:S6754
sonar.issue.ignore.multicriteria.runonce.resourceKey=packages/workbench/src/workbench.tsx

# Not TODOs. This module PARSES jsdoc tags, and its own prose names the tags it
# handles - "a demo can carry `@see` or `@todo` for the next reader" - so the
# word appears as documentation of the feature, not as an unfinished task.
sonar.issue.ignore.multicriteria.demotags.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.demotags.resourceKey=packages/workbench/src/demos.ts

# `isTVSelectable` is deprecated in React Native's own types and is still the
# prop this FORK acts on: react-native-tvos is what decides which element the
# platform can focus, and the key host below exists only to hold that focus so
# the navigator can interpret every press itself. Dropping the prop does not
