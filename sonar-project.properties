# `::error::` is a GitHub Actions WORKFLOW COMMAND, not a shell error message.
# The runner parses workflow commands off the job's STDOUT; redirecting them to
# stderr does not move the annotation, it deletes it - the step still fails on
# `exit 1`, but the run and the PR lose the line saying why. Every hit of this
# rule in .github/scripts is an `echo "::error::..."`, so the rule is asking for
# the one change that would break them.
sonar.issue.ignore.multicriteria.ghannot.ruleKey=shelldre:S7677
sonar.issue.ignore.multicriteria.ghannot.resourceKey=.github/scripts/*.sh

# The admin picker is a WAI-ARIA combobox with a listbox popup: a text input
# filters the list, and `aria-controls` + `aria-activedescendant` name the
# active row from that input. The rule's suggested replacements are the reason
# it cannot apply - a native `<select>` (with `size`/`multiple`) and `<datalist>`
# both refuse to host the filter field the control exists for, and dropping
# `role="listbox"` would leave `aria-activedescendant` pointing at rows a screen
# reader no longer reads as options. The rows themselves ARE real buttons, so
# the keyboard/pointer half of the pattern needs no exception.
sonar.issue.ignore.multicriteria.comboboxlist.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.comboboxlist.resourceKey=clients/web/src/features/admin/search-select.tsx

