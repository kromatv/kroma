# `aria-hidden` on the hero's WebGL <canvas>. The rule is "aria-hidden must not be set on
# a FOCUSABLE element", and a bare <canvas> is not focusable: it is not an interactive
# element and it carries no tabindex, so there is nothing for the attribute to hide from
# the keyboard. Biome's own copy of this rule agrees and does not flag it. The canvas is
# pure decoration (the burst behind the lockup) and hiding it is the correct call.
sonar.issue.ignore.multicriteria.canvashidden.ruleKey=typescript:S6825
sonar.issue.ignore.multicriteria.canvashidden.resourceKey=apps/www/src/components/home/hero-beams.tsx

