<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KROMA Kit</title>
    <!-- Paint the stage black before the bundled CSS loads, so the launch
         never flashes a white body. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0c;
        color-scheme: dark;
      }
      /* React Native Web's flex:1 needs a flex ancestor; AppRegistry usually
         provides one, but this site mounts with createRoot directly. Fixing the
         root's height also keeps the workbench from growing past the viewport
         (and the first autofocus from scrolling the page). */
      #root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
