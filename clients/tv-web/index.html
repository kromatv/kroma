<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Free-size, unlike the packaged shells. A television IS a 1920x1080 panel,
         so those shells pin the viewport to the stage they are authored against;
         a browser window is any shape at all, and the layout reflows for it (the
         same path the desktop shell takes on macOS/Windows). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KROMA</title>
    <!-- Stated here rather than in a stylesheet so the stage is black from the
         very first frame, before the bundle loads, and the launch never flashes
         a white body. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0c;
        color-scheme: dark;
      }
      body {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
