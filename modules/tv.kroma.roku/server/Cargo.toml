# This module is its own cargo workspace: it builds standalone, outside the
# server tree, and is packed into a `.kmod` on its own. Package metadata and
# dependency versions are explicit here rather than inherited.
[workspace]

[package]
name = "kroma-roku"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "KROMA Roku module (backend): finds Roku boxes on the LAN, sideloads the KROMA channel onto them, and serves the channel its screens."
license = "MIT"
build = "build.rs"

[[bin]]
name = "kroma-module-roku"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk" }
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"

[build-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The shared HostCtx double and the scratch dir, through the SDK's `testing`
# feature rather than a second path into the host crate.
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["testing"] }
# `oneshot`, to drive the console's routes without binding a port.
tower = { version = "0.5", features = ["util"] }

# The profile `bun run modules:pack` builds this sidecar with: release + `panic =
# "abort"`. Mirrors server/Cargo.toml's [profile.release]; a profile is only
# honoured at a workspace root, and this module is its own workspace.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
debug = "line-tables-only"
