# This module is its own cargo workspace: it builds standalone, outside the
# server tree, and is packed into a `.kmod` on its own. Package metadata and
# dependency versions are explicit here rather than inherited.
[workspace]

[package]
name = "kroma-acquisition"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The acquisition vertical: interactive/manual search, release scoring, grab + import, and the automatic wanted-list pass. Rides on the Downloads module's engine."
license = "AGPL-3.0-or-later"

[[bin]]
# The module's `.kmod` entrypoint: a component running the search / import / match
# passes as jobs (see src/bin/module.rs).
name = "kroma-module-acquisition"
path = "src/bin/module.rs"

[dependencies]
# SDK-only: acquisition reaches the Downloads / Indexer / Torznab modules purely
# through the SDK ports (DownloadGrabPort, DownloadDbPort, IndexerSearchPort, ...),
# resolved at runtime through the host registry, so it names no sibling crate.
# `requests`: this module orchestrates the core's request / wanted ledger, within
# the grant module.json declares. It never takes `engine`, which cannot build for
# a component.
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["storage", "core", "domain", "requests"] }
# The two shared libraries, linked rather than reached over a point: naming
# renders one path per imported file and the release parser scores every release
# of every search, so a localhost round trip per call would be slower than the
# code it replaced.
kroma-naming = { path = "../../lib/naming" }
kroma-scene = { path = "../../tv.kroma.scene/server" }
# The `.kmod` binary: the module runtime + the cross-module port bridges (client
# proxies to the Downloads + Indexer modules).
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime", features = ["storage"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# The importer walks a completed download's folder for video files.
walkdir = "2"

[dev-dependencies]
# The shared HostCtx doubles, the throwaway pool and the self-deleting scratch
# dir, all through the SDK's `testing` feature.
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["testing"] }
# `oneshot`, to drive the module routes without binding a port.
tower = "0.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "form", "matched-path"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }
kroma-sqlite-guest = { path = "../../../server/crates/kroma-sqlite-guest" }

# The profile `kroma build` builds this component with: release + `panic =
# "abort"`, which drops the unwinding tables at no speed cost (opt-level stays
# 3). Safe for a component: a panic traps its instance, and the host starts a
# fresh one. Defined per module because a profile is only honoured at a
# workspace root, and each module is its own workspace.
# Mirrors server/Cargo.toml's [profile.release]. A profile is only honoured at a
# workspace root, and this module is its own workspace, so `inherits = "release"`
# below would otherwise pick up cargo's DEFAULT release: no LTO, 16 codegen
# units, unstripped.
[profile.release]
opt-level = 3
# ThinLTO, not fat: measured at 1116 vs 1117 ns/pair on the parse+score hot path
# (i.e. no difference) for 3.4x faster links, because fat LTO + one codegen unit
# is whole-program and single-threaded. It costs ~100 KB per compressed .kmod.
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
# No debug info. On macOS any level keeps every codegen unit's object file in
# debug/deps, and they piled up past 20 GB a day. A panic still names its
# file:line; backtrace frames name the function only.
debug = false
