# This module is its own cargo workspace: it builds standalone, outside the
# server tree, and is packed into a `.kmod` on its own. Package metadata and
# dependency versions are explicit here rather than inherited.
[workspace]

[package]
name = "kroma-acquisition"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The acquisition vertical: interactive/manual search, release scoring, grab + import, and the automatic wanted-list pass. Rides on the Downloads module's engine."
license = "MIT"

[[bin]]
# The module's `.kmod` entrypoint: an out-of-process sidecar running the search /
# import / match passes on resident timers (see src/bin/module.rs).
name = "kroma-module-acquisition"
path = "src/bin/module.rs"

[dependencies]
# SDK-only: acquisition reaches the Downloads / Indexer / Torznab modules purely
# through the SDK ports (DownloadGrabPort, DownloadDbPort, IndexerSearchPort, ...),
# resolved at runtime through the host registry, so it names no sibling crate.
# `storage` + `engine`: this module orchestrates the core's request /
# wanted ledger, so it reaches both, within the grant module.json declares.
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["storage", "engine"] }
# The `.kmod` binary: the out-of-process runtime + the cross-module port bridges
# (client proxies to the Downloads + Indexer sidecars).
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime", features = ["storage"] }
axum = { version = "0.8", features = ["macros", "ws"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# The importer walks a completed download's folder for video files.
walkdir = "2"
# FICLONE reflink for imports: an instant copy-on-write clone across Btrfs/XFS
# subvolumes on one filesystem (e.g. Synology @appdata -> a media shared folder),
# where a hard link fails and the kernel is too old for std::fs::copy to reflink.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# The shared HostCtx doubles (`host::testing::StubHost`), reached through the
# SDK's re-export. Enabling the feature here is what compiles them.
kroma-module-host = { path = "../../../server/crates/kroma-module-host", features = ["testing"] }
# `oneshot`, to drive the sidecar routes without binding a port.
tower = "0.5"
# `db::testing`: the scoped pool the storage-grant test asserts against.
kroma-db = { path = "../../../server/crates/kroma-db", features = ["testing"] }
# The scratch directory that takes itself with it, panic or not.
kroma-testing = { path = "../../../server/crates/kroma-testing" }

# The profile `bun run modules:pack` builds this sidecar with: release + `panic =
# "abort"`. Dropping the unwinding tables makes the binary ~11% smaller at NO
# speed cost (opt-level stays 3). Safe for a sidecar: a panic aborts the module
# process and the supervisor respawns it. Defined per module because a profile is
# only honoured at a workspace root, and each module is now its own workspace.
# Mirrors server/Cargo.toml's [profile.release]. A profile is only honoured at a
# workspace root, and this module is its own workspace, so `inherits = "release"`
# below would otherwise pick up cargo's DEFAULT release: no LTO, 16 codegen
# units, unstripped.
[profile.release]
opt-level = 3
# ThinLTO, not fat: measured at 1116 vs 1117 ns/pair on the parse+score hot path
# (i.e. no difference) for 3.4x faster links, because fat LTO + one codegen unit
# is whole-program and single-threaded. It costs ~100 KB per compressed .kmod.
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"
