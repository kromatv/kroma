[workspace]

[package]
name = "kroma-module-plex"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "The Plex importer: describes a Plex Media Server household to the KROMA core, read-only"
license = "AGPL-3.0-or-later"

[[bin]]
name = "kroma-module-plex"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["storage"] }
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime", features = ["storage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
quick-xml = "0.42"

[dev-dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "form", "matched-path"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
debug = "line-tables-only"
