# This module is its own cargo workspace: it builds standalone, outside the
# server tree, and is packed into a `.kmod` on its own. Package metadata and
# dependency versions are explicit here rather than inherited.
[workspace]

[package]
name = "kroma-whisper"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "In-process Whisper subtitle transcription (candle, no external whisper.cpp)"
license = "AGPL-3.0-or-later"

[[bin]]
# The module's `.kmod` entrypoint: a provider serving transcription, with
# progress/cancel via a shared DB row (see src/bin/module.rs).
name = "kroma-module-whisper"
path = "src/bin/module.rs"

[package.metadata.kmod]
# The packed `.kmod` bundles the real candle inference backend; without it
# transcribe() is a no-op stub.
features = ["local"]

[features]
# Off by default: the public `transcribe()` compiles to a stub returning None.
# `local` pulls in the candle inference graph (the only real backend).
local = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:tracing"]

# GPU acceleration for a native build (never the component). Each widens what the
# CPU pure-Rust `local` build CAN use; the engine picks the device at runtime and
# falls back to CPU.
metal = ["local", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["local", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
accelerate = ["local", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]

[dependencies]
# `storage`: the progress channel is a core table this module holds a grant on
# (see `storage` in module.json).
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["storage"] }
# The `.kmod` binary: the runtime + axum for the transcription route.
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime", features = ["storage"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
tracing = { version = "0.1", optional = true }
# CPU-only pure-Rust backends: a component holds no C.
candle-core = { version = "0.11", default-features = false, optional = true }
candle-nn = { version = "0.11", default-features = false, optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }

# A native macOS build (the tests) lights up the Metal GPU automatically: gated on
# the target OS so a component never pulls it in. Inert until `local` pulls candle.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", default-features = false, features = ["metal"], optional = true }
candle-nn = { version = "0.11", default-features = false, features = ["metal"], optional = true }
candle-transformers = { version = "0.11", default-features = false, features = ["metal"], optional = true }

[dev-dependencies]
# `db::testing`: the scoped pool the storage-grant test asserts against.
# `core` for the grant test: it prepares its statements against the core
# schema, not a copy of the two columns it reaches.
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["testing", "core"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "form", "matched-path"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }

# The profile `kroma build` builds this component with: release + `panic =
# "abort"`, which drops the unwinding tables at no speed cost (opt-level stays
# 3). Safe for a component: a panic traps its instance, and the host starts a
# fresh one. Defined per module because a profile is only honoured at a
# workspace root, and each module is its own workspace.
# Mirrors server/Cargo.toml's [profile.release]. A profile is only honoured at a
# workspace root, and this module is its own workspace, so `inherits = "release"`
# below would otherwise pick up cargo's DEFAULT release: no LTO, 16 codegen
# units, unstripped.
[profile.release]
opt-level = 3
# ThinLTO, not fat: measured at 1116 vs 1117 ns/pair on the parse+score hot path
# (i.e. no difference) for 3.4x faster links, because fat LTO + one codegen unit
# is whole-program and single-threaded. It costs ~100 KB per compressed .kmod.
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
# No debug info. On macOS any level keeps every codegen unit's object file in
# debug/deps, and they piled up past 20 GB a day. A panic still names its
# file:line; backtrace frames name the function only.
debug = false
