# This module is its own cargo workspace: it builds standalone, outside the
# server tree, and is packed into a `.kmod` on its own. Package metadata and
# dependency versions are explicit here rather than inherited.
[workspace]

[package]
name = "kroma-sabnzbd"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "KROMA SABnzbd download engine: a module answering the download-client point over the SABnzbd API."
license = "AGPL-3.0-or-later"

[[bin]]
name = "kroma-module-sabnzbd"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk" }
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime" }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "form", "matched-path"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["testing"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
debug = false
