name: Release Apple TV beta channel

# The Apple TV client, to TestFlight.
#
# WHY THIS IS NOT IN _release-tv.yml, WHICH BUILDS EVERY OTHER TELEVISION. The
# other three TV clients produce a FILE - a webOS .ipk, a Tizen .wgt, an Android
# TV .apk - which is attached to the GitHub Release and sideloaded by hand, so
# `publish` rightly waits on them: the release is not complete without its
# assets. This one produces nothing a user can install; an App Store .ipa is
# only reachable through TestFlight. Leaving it in that workflow would put the
# Apple upload service on the critical path of every server release, which is
# the exact coupling _release-mobile.yml exists to avoid ("a beta-channel hiccup
# must never hold back a server release"). So it is its own called workflow,
# absent from the publish job's `needs`, next to the phone app rather than next
# to the televisions.
#
# It ships the SAME app record as the phone: App Store Connect 6793457018 carries
# iOS and tvOS as two platforms of one listing (a universal purchase), which is
# why both sign as `tv.kroma.mobile` - see clients/tv-native/app.config.ts.
#
# Stable tags or an explicit manual run, never an untagged build: a TestFlight
# number is spent for good, and a build that burned one would also mail every
# tester about it.
#
# `expo prebuild` runs under NODE, never under the bun runtime: bun's runtime
# corrupts the template extraction (NUL-padded files). bun stays the package
# manager.
#
# `targets` is read straight off `github.event.inputs` rather than through a
# workflow input: in a called workflow the `github` context is still the
# CALLER's, so the gating expression stays byte-identical to its siblings'.

on:
  workflow_call:
    inputs:
      version:
        description: 'Full release version.'
        type: string
        required: true
      triplet:
        description: 'Sanitized x.y.z. App Store Connect rejects a version carrying a channel suffix.'
        type: string
        required: true
      channel:
        description: 'stable | candidate | none. Only `stable` reaches TestFlight.'
        type: string
        required: true

env:
  BUN_VERSION: '1.3.14' # keep in sync with release.yml

jobs:
  appletv:
    name: Apple TV .ipa (TestFlight)
    if: ${{ (contains(fromJSON('["stable","candidate"]'), inputs.channel) || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    # macos-26, NOT macos-15, for the reason the phone job spells out: Expo SDK
    # 57 pulls Swift packages built with Swift tools 6.2 (expo-modules-jsi), and
    # the macos-15 image tops out at Xcode 16.4 / Swift 6.1. The guard step below
    # states that in one line instead of letting it surface as a package
    # resolution error thousands of lines into an xcodebuild log.
    runs-on: macos-26
    permissions:
      contents: read # only reads the repo and uploads run artifacts
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - name: Select Xcode
        run: |
          set -euo pipefail
          newest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          [ -n "$newest" ] || { echo "no Xcode on this runner"; exit 1; }
          sudo xcode-select -s "$newest"
          echo "using $newest"
          xcodebuild -version
          # Part of the DerivedData cache key: see the mobile job.
          echo "XCODE_VERSION=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_ENV"
          swift_version=$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)
          echo "swift $swift_version"
          # Expo SDK 57's expo-modules-jsi declares swift-tools-version 6.2.
          if [ "$(printf '%s\n6.2\n' "$swift_version" | sort -V | head -1)" != "6.2" ]; then
            echo "::error::Swift $swift_version is too old for the Expo SDK (needs 6.2+). Bump the runner image."
            exit 1
          fi

      # The CERTIFICATE is the phone app's, deliberately: one Apple Distribution
      # identity signs every platform a team ships, and these two are the same
      # bundle id besides. The PROFILE is not shared - Apple mints one per
      # platform - hence a tvOS-only secret beside it. Without either there is
      # nothing uploadable, so the job no-ops rather than failing the release,
      # the stance every optional signing step in this fleet takes.
      #
      # Since the Top Shelf extension (tv-native's with-top-shelf plugin), the
      # imported profile alone no longer covers the whole archive: the app
      # embeds KromaTopShelf, which signs as tv.kroma.mobile.TopShelf with its
      # own App Store profile that only the ASC-key-authenticated automatic
      # signing can resolve (it registers the App ID, the App Group, and mints
      # both profiles on first archive). The profile secret stays required as
      # this gate, but the ASC key trio is what actually signs - and the App
      # Group's first appearance invalidates previously minted tv.kroma.mobile
      # profiles, which automatic signing re-mints and a stored one cannot.
      - name: Check signing secrets
        id: signing
        env:
          IOS_CERTIFICATE: ${{ secrets.MOBILE_IOS_CERTIFICATE }}
          TVOS_PROFILE: ${{ secrets.TVOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_CERTIFICATE" ] || [ -z "$TVOS_PROFILE" ]; then
            echo "No MOBILE_IOS_CERTIFICATE / TVOS_PROVISIONING_PROFILE; skipping the Apple TV build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.signing.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      # `ios/` is generated and gitignored, so the project is built from the Expo
      # config every time. EXPO_TV=1 (set by the package's own `prebuild` script)
      # is what makes it an APPLE TV target rather than a phone one - SDKROOT
      # appletvos, device family 3, a tvOS Podfile. Without it this produces an
      # iPhone project that the tvOS profile cannot sign.
      #
      # Version and build number reach the project through app.config.ts rather
      # than a stamping script, because that file already had to compute them for
      # Android. KROMA_VERSION pins the plain x.y.z App Store Connect will accept
      # (its default source, server/Cargo.toml, is not what the caller resolved
      # for an untagged build); KROMA_VERSION_CODE is the monotonic build number, minutes
      # since 2020 - the same base the Android TV and phone jobs use. Reusing a
      # (version, build) pair is refused on upload, an hour after the archive
      # that produced it began.
      # Same reasoning as the mobile job: the archive rebuilt every pod on every
      # run because `expo prebuild` DELETES and regenerates ios/, so every
      # source arrived with a new mtime and Xcode - which invalidates on mtime -
      # rebuilt the lot. Caching Pods/ alone does nothing; prebuild wipes it.
      # So cache the generated project and skip prebuild when its inputs match.
      #
      # EXACT key, no restore-keys: a near-miss would archive a project
      # generated from a different config, and it would ship happily.
      - name: Cache the prebuilt tvOS project
        if: steps.signing.outputs.ready == 'true'
        id: ios-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            clients/tv-native/ios
            ~/Library/Caches/CocoaPods
          # The config PLUGINS are hashed too. They generate part of the
          # project - the Top Shelf extension's whole Info.plist comes from
          # one - so a plugin edit changes prebuild's output while leaving
          # every manifest untouched. Without them in the key, a cache hit
          # skips prebuild and silently rebuilds the OLD project: the arm64
          # fix would have been cached straight over.
          key: ios-tvnative-v2-${{ env.XCODE_VERSION }}-${{ hashFiles('bun.lock', 'clients/tv-native/package.json', 'clients/tv-native/app.config.ts', 'clients/tv-native/plugins/**') }}

      # The build number is minutes-since-2020, so a restored project carries
      # the one from the run that cached it and App Store Connect would refuse
      # the duplicate. Re-stamp the plist rather than regenerate the project.
      - name: Re-stamp the restored project
        if: steps.signing.outputs.ready == 'true' && steps.ios-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          plist=$(find clients/tv-native/ios -maxdepth 2 -name Info.plist | head -1)
          [ -n "$plist" ] || { echo "::error::no Info.plist in the restored project"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.triplet }}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(( ( $(date -u +%s) - 1577836800 ) / 60 ))" "$plist"
          echo "re-stamped $plist"

      - name: Prebuild the tvOS project
        if: steps.signing.outputs.ready == 'true' && steps.ios-cache.outputs.cache-hit != 'true'
        env:
          KROMA_VERSION: ${{ inputs.triplet }}
        run: |
          set -euo pipefail
          export KROMA_VERSION_CODE=$(( ( $(date -u +%s) - 1577836800 ) / 60 ))
          bun run --filter '@kroma/tv-native' prebuild -- --platform ios --no-install
          # REACT_NATIVE_NODE_MODULES_DIR: the Podfile resolves react-native from
          # wherever node does, and in this bun workspace the tvOS fork
          # (react-native-tvos) sits in the PACKAGE's node_modules, not the
          # workspace root's. Without it CocoaPods builds the phone fork's pods
          # into a tvOS target. Same value as the package's own `pod` script.
          cd clients/tv-native/ios
          REACT_NATIVE_NODE_MODULES_DIR="$PWD/../node_modules" pod install

      # Same reasoning as the phone job: a profile is derived from the App ID's
      # current capabilities, so it is minted per run rather than stored. One
      # call covers both bundle ids - the app and its Top Shelf extension.
      - name: Mint provisioning profiles
        id: profiles
        if: steps.signing.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" || -z "${ASC_PRIVATE_KEY:-}" ]]; then
            echo "No App Store Connect key; falling back to the stored profile secrets."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          if ASC_PRIVATE_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
             python3 .github/scripts/asc-mint-profiles.py --out "$RUNNER_TEMP/profiles"; then
            echo "minted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::minting failed; falling back to the stored profile secrets"
          fi
          rm -f "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Import certificate + provisioning profile
        if: steps.signing.outputs.ready == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.MOBILE_IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.MOBILE_IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_FILE: ${{ steps.profiles.outputs.minted == 'true' && format('{0}/profiles/tvos.b64', runner.temp) || '' }}
          IOS_PROFILE: ${{ secrets.TVOS_PROVISIONING_PROFILE }}
          # The Top Shelf extension is a separate bundle id and so a separate
          # profile; without it that target goes unsigned and the export fails
          # with "No profiles for 'tv.kroma.mobile.TopShelf' were found".
          IOS_PROFILE_EXTRA_FILE: ${{ steps.profiles.outputs.minted == 'true' && format('{0}/profiles/tvos-topshelf.b64', runner.temp) || '' }}
          IOS_PROFILE_EXTRA: ${{ secrets.TVOS_TOPSHELF_PROVISIONING_PROFILE }}
        run: .github/scripts/ios-import-signing-assets.sh

      # DerivedData is cached SEPARATELY from the project above, and with
      # restore/save rather than `cache`, because the two differ in the one way
      # that matters: the generated project is immutable for a given config,
      # while these object files change on every commit. actions/cache does not
      # re-save a key that already hit - so sharing one entry froze DerivedData
      # at whatever the first run stored (nothing), and the archive stayed a
      # full rebuild while the cache reported a hit.
      #
      # Unique key per run + a prefix restore-key: every run restores the most
      # recent objects and saves its own, which is what makes the compile
      # incremental instead of merely cached.
      - name: Restore DerivedData
        if: steps.signing.outputs.ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived/tvnative
          key: dd-tvnative-v1-${{ env.XCODE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            dd-tvnative-v1-${{ env.XCODE_VERSION }}-
            dd-tvnative-v1-

      - name: Archive + export .ipa
        if: steps.signing.outputs.ready == 'true'
        working-directory: clients/tv-native/ios
        env:
          DERIVED_DATA: ${{ github.workspace }}/.derived/tvnative
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
          # The only two things that differ from the phone archive.
          SDK: appletvos
          ARTIFACT: KROMA-appletv
          # Two targets, a profile each, pinned per target in the pbxproj. The
          # archive on 2026-07-27 signed with "Apple Development: Created via
          # API" and then failed the export for BOTH bundle ids - automatic
          # signing inventing an identity rather than using the ones installed.
          MANUAL_SIGNING: '1'
          # Authenticates `-allowProvisioningUpdates`: the Expo template leaves
          # the project on automatic signing, so xcodebuild resolves the App
          # Store profile itself and cannot do it anonymously.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        # Called by absolute path: this step runs from clients/tv-native/ios.
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ios-archive-export-ipa.sh"


      # `-t tvos` is the whole difference from the phone upload: the platform is
      # what tells App Store Connect which half of the record this build belongs
      # to. A tvOS .ipa sent as `-t ios` is rejected outright.
      #
      # An App Store Connect API key is preferred; the app-specific password the
      # desktop job already uses for notarization is the fallback.
      # Trimmed first: the repo's 10GB cache budget already holds ~2.5GB of Rust
      # and ~1.2GB of Gradle, and an untrimmed pair of Apple projects would evict
      # them by LRU. Intermediates.noindex is the part worth keeping - it is the
      # object files; the rest regenerates in seconds.
      - name: Trim and save DerivedData
        if: always() && steps.signing.outputs.ready == 'true'
        run: |
          dd=.derived/tvnative
          [ -d "$dd" ] || { echo "no DerivedData at $dd"; exit 0; }
          # ModuleCache and Build/Products are KEPT. Deleting them is what kept
          # the archive at ~14 minutes despite a restored cache: this is an
          # ObjC/C++ project where essentially every file imports a Clang
          # module, so an absent module cache invalidates the objects that
          # depend on it and Xcode recompiled all ~540 of them. Products are the
          # built frameworks - without them every link runs again too.
          #
          # What goes is only what regenerates for free: the source index no
          # build reads, the logs, and SPM checkouts that are re-fetched.
          rm -rf "$dd/Index.noindex" "$dd/Logs" "$dd/SourcePackages/checkouts" || true
          echo "DerivedData now $(du -sh "$dd" | cut -f1)"

      - name: Save DerivedData
        if: always() && steps.signing.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived/tvnative
          key: dd-tvnative-v1-${{ env.XCODE_VERSION }}-${{ github.run_id }}

      - name: Validate for the App Store
        # Runs on every candidate, upload or not: v0.1.35's .ipa archived,
        # signed and exported perfectly and was then rejected AT UPLOAD (90502,
        # a plist key only App Store validation checks) - with the promote step
        # first to learn it. --validate-app runs those same checks without
        # claiming a build number or notifying a tester, so a green candidate
        # now means "TestFlight would take this".
        if: steps.signing.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IPA: out/KROMA-appletv-${{ inputs.version }}.ipa
          PLATFORM: tvos
          MODE: validate
        run: .github/scripts/upload-to-testflight.sh

      - name: Upload to TestFlight
        # A CANDIDATE build compiles the .ipa and stops there - that is what the
        # gate needs to know. Distribution is a deploy-time act, not a
        # side effect of every push to main.
        # `targets` says what to BUILD; it must not also mean "ship it".
        # A dispatch with targets=mobile, run to time the archive, pushed a
        # real build to TestFlight and burned a build number - distribution
        # was riding on a selector that only ever meant scope. It now needs
        # the explicit `distribute` input, so a build-only run stays one.
        if: ${{ steps.signing.outputs.ready == 'true' && (inputs.channel == 'stable' || github.event.inputs.distribute == 'true') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IPA: out/KROMA-appletv-${{ inputs.version }}.ipa
          PLATFORM: tvos
        run: .github/scripts/upload-to-testflight.sh

      - name: Upload .ipa artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-appletv-ipa
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 30
