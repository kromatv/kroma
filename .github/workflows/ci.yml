name: CI

# Every push/PR proves the client fleet it can affect builds in PRODUCTION
# mode (the `changes` job skips the halves a change cannot touch):
#  - web SPA
#  - Samsung Tizen bundle
#  - LG webOS bundle - BOTH tiers: modern (Chrome 99+) AND legacy (Chromium
#    53-94, 2018-2023 TVs), with the check-legacy guard that fails the build if
#    anything a legacy engine can't parse/render sneaks in
#  - Android TV web bundle + the Kotlin shell compiled to an APK
#  - the desktop (Tauri) shell via cargo check on Linux, which compiles the
#    Linux/Steam-Deck mpv path
#  - the Rust server (clippy + tests + architecture guards)
#
# No dev mode anywhere: `vite build` runs in production mode, the shared TV
# shell factory (clients/tv-build/shell.ts) strips console/debugger on build,
# and KROMA_TV_DEVICE (on-device dev HMR) is never set in CI.

# Docs-only changes build nothing and check nothing; skip the run entirely.
# (No branch protection requires these checks, so a skipped run blocks nobody.)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  # Which half of the fleet the change can actually touch. `rust` gates the
  # server job (a JS-only PR pays no clippy+test), `fleet` gates the client
  # builds (a server-only PR pays no vite/gradle/tauri). `quality` stays
  # unconditional: it is the cheap always-green check, and its inputs (biome,
  # vitest, tokens) span too much of the tree to be worth a filter.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      fleet: ${{ steps.f.outputs.fleet }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: f
        with:
          filters: |
            rust:
              - 'server/**'
              # kroma-engine include_str!s these catalogs at compile time.
              - 'packages/core/src/locales/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            fleet:
              - 'clients/**'
              - 'packages/**'
              # bun patches change what an install produces.
              - 'patches/**'
              - 'bun.lock'
              - 'package.json'
              - 'tsconfig.base.json'
              # desktop-shell compiles Rust under the repo toolchain pin.
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  quality:
    name: Typecheck + unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Hard gate: every workspace must type-check (@kroma/core, ui, tv, web, shells).
      - name: Typecheck
        run: bun run typecheck

      # Hard gate: unit tests (engine selection, direct-play planning, formatters).
      - name: Unit tests (vitest)
        run: bun run test

      # Hard gate: the generated token CSS matches the TypeScript tokens it is
      # generated FROM. Without this a hand edit to src/styles/tokens survives,
      # and the two halves of the design system drift apart silently.
      - name: Design tokens are in step
        run: bun run tokens:check

      # Hard gate: the Biome backlog is cleared (`bun run check` is clean), so
      # lint + format regressions now fail CI.
      - name: Biome (lint + format)
        run: bun run check

  clients:
    name: Client / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.fleet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            build: bun run build:web
            dist: clients/web/dist
          # The showcase site (kroma.tv). Its build IS the prerender, so a broken
          # page, a bad link in the crawl or an .mdx that will not compile fails
          # here rather than at deploy time.
          - name: site
            build: bun run build:site
            dist: clients/site/dist/client
          - name: tizen
            build: bun run build:tizen
            dist: clients/tizen/dist
          # Builds BOTH tiers (modern ESM + legacy ES2015/flattened-CSS for old
          # models) and runs the Chromium-53 compat guard as part of the script.
          - name: webos
            build: bun run build:webos
            dist: clients/webos/dist
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (production)
        run: ${{ matrix.build }}

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-${{ matrix.name }}-ci
          path: ${{ matrix.dist }}
          retention-days: 7
          if-no-files-found: error

  # The native TV app (Apple TV + Android TV). The Android half is the gate for
  # the local Expo modules' Kotlin - the launcher rows in particular, which no
  # JS-only check compiles. `android/` is generated (gitignored), so prebuild
  # first. The Apple TV half needs a macOS runner and is not built here.
  tv-native:
    name: Native TV app (Android compile)
    needs: changes
    if: needs.changes.outputs.fleet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '8.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The JS gate: the Metro bundle must resolve on both platforms.
      - name: Bundle check
        run: bun run build:tv-native

      - name: Prebuild the Android project
        run: bun run --filter '@kroma/tv-native' prebuild -- --platform android

      - name: Compile the APK
        run: gradle -p clients/tv-native/android assembleDebug

  desktop-shell:
    name: Desktop shell (cargo check, Linux/mpv path)
    needs: changes
    if: needs.changes.outputs.fleet == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # shared-key (not the default per-job key) so this cache is one stable
      # entry instead of a per-job copy; save only from main so PR runs restore
      # but never add 400 MB entries to the 10 GB repo quota (going over it
      # LRU-evicts everything, which is what made every Rust job build cold).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: clients/desktop/src-tauri
          shared-key: desktop-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tauri v2 Linux system deps (compile-time only; mpv stays a runtime dep).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri's generate_context! needs the frontend dist to exist.
      - name: Build desktop frontend
        run: bun run --filter '@kroma/desktop' build

      # tauri.linux.conf.json declares the `kroma-mpv` externalBin sidecar; fetch it
      # so the merged config always points at a real file (skips when already there).
      - name: Fetch bundled mpv (Linux sidecar)
        run: bash clients/desktop/scripts/fetch-mpv.sh

      # Compiles the Linux binary-engine path (mpv.rs IPC + mpv_dispatch routing)
      # that macOS dev machines cannot check. --no-default-features = WITHOUT the
      # in-process libmpv engine: ubuntu-22.04's libmpv is too old for the libmpv2
      # crate (needs .so.2 / mpv 0.35+), and the Linux release ships the binary
      # engine anyway. The libmpv paths are compile-checked cross-platform (macOS
      # dev / Windows via cargo-xwin); the Linux libmpv build needs a modern distro.
      - name: cargo check
        working-directory: clients/desktop/src-tauri
        run: cargo check --all-targets --no-default-features

  server:
    name: Server (Rust) clippy + test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Debug info is most of the bytes in a dev/test target dir (this cache was
      # 1.0-1.5 GB per copy). CI only needs pass/fail, not symbolized backtraces,
      # so drop it: smaller cache, faster linking, less quota pressure.
      CARGO_PROFILE_DEV_DEBUG: '0'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      # One stable entry (shared-key), written only from main: PRs used to save a
      # ~1.4 GB copy each, and four of them alone exceeded half the 10 GB repo
      # cache quota - which evicted the .spk/module/desktop caches and forced
      # cold builds everywhere. See the same pattern in sonar.yml/release.yml.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: server
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Non-blocking: the codebase uses a custom import grouping, not rustfmt's.
      - name: rustfmt --check
        run: cargo fmt --check
        continue-on-error: true

      # Hard gates. clippy without `-D warnings` (a couple of pre-existing
      # warnings are surfaced in the log but don't fail the build).
      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: test
        run: cargo test --workspace

      # Domain purity is now enforced by the compiler, not a grep: the entities +
      # pure rules live in the `kroma-domain` crate (crates/kroma-domain), which
      # depends only on serde. An accidental `use axum::`/`use rusqlite::` there
      # won't resolve and `cargo build` above fails. Dependencies still point
      # inward (api → services → {db,infra} → domain). See ARCHITECTURE.md.
