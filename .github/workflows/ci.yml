name: CI

# The gate every push and pull request passes, and the one place the tree is
# measured. Every step is `bun run ci <command>` (packages/ci-tools), so a job
# is the list of commands a laptop runs too; docs/ci.md explains the shape.
#
# `lanes` decides which jobs a change can reach. `required` is the one check
# main requires: it passes a skipped job only when `lanes` turned its lane
# off, so a docs-only pull request builds nothing and a failed `lanes` cannot
# pass as a run that skipped everything.
#
# workflow_dispatch runs every lane: the Rust caches save only from main, so
# once evicted they stay cold until a Rust-touching push lands there. A manual
# run on main rebuilds and saves them.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARDS: 4

jobs:
  lanes:
    name: Lanes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      code: ${{ steps.lanes.outputs.code }}
      fleet: ${{ steps.lanes.outputs.fleet }}
      android: ${{ steps.lanes.outputs.android }}
      desktop: ${{ steps.lanes.outputs.desktop }}
      rust: ${{ steps.lanes.outputs.rust }}
      rust_shards: ${{ steps.lanes.outputs.rust_shards }}
      sdk: ${{ steps.lanes.outputs.sdk }}
      sonar: ${{ steps.sonar.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile --filter '@kromatv/ci-tools'
      - id: lanes
        run: bun run ci lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Secrets cannot be read in a job-level `if`, so the scan's precondition
      # is an output here. A fork's pull request has no token and skips clean.
      - id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "run=${{ env.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Head branch matches type/slug
        env:
          BRANCH: ${{ github.head_ref }}
          PATTERN: '^(feat|fix|chore|ci|docs|refactor|perf|test|build|kit|release|revert|claude|dependabot)/[A-Za-z0-9._/-]+$'
        run: |
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::branch '$BRANCH' does not match $PATTERN"
            exit 1
          fi

  checks:
    name: Typecheck + lint
    needs: lanes
    if: needs.lanes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/lint-rules coverage
      - run: sed -i 's|^SF:|SF:packages/lint-rules/|' packages/lint-rules/coverage/lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lint-rules
          path: packages/lint-rules/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error
      - run: bun run typecheck
      - run: bun run check
      - run: bun run ci embeds

  test:
    name: Unit tests ${{ matrix.shard }}/4
    needs: lanes
    if: needs.lanes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run ci test --shard ${{ matrix.shard }}/${{ env.SHARDS }}
      # A dot-directory: without include-hidden-files the upload finds nothing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  audit:
    name: Kit audit
    needs: lanes
    if: needs.lanes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run ci test --audit

  # One report from the four shards: the lcov Sonar reads and the summary the
  # run page shows. Required on main in place of the shards themselves, so a
  # shard that never ran (a cancelled runner) cannot pass as a green run.
  test-report:
    name: Unit tests
    needs: [lanes, test]
    if: ${{ !cancelled() && needs.lanes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: .vitest-attempts
      - run: bun run ci test --merge --expect ${{ env.SHARDS }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: lanes
    if: needs.lanes.outputs.fleet == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [web, site, tizen, webos, tv-native]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      # The site's build reads the published releases from the GitHub API to
      # bake /download. Anonymous GitHub allows sixty requests an hour per IP
      # and runners share them; the token keeps this off a limit someone else
      # spent.
      - id: build
        run: bun run ci build ${{ matrix.target }} ${{ matrix.target == 'tizen' && '--slice' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.build.outputs.dist != ''
        with:
          name: kroma-${{ matrix.target }}-ci
          path: ${{ steps.build.outputs.dist }}
          retention-days: 7
          if-no-files-found: error
      # Sideloading sets: one build, one package per Tizen generation.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.build.outputs.slices != ''
        with:
          name: kroma-tizen-generations-ci
          path: ${{ steps.build.outputs.slices }}
          retention-days: 7
          if-no-files-found: error

  # The native TV app's Kotlin (the launcher rows in particular), which no
  # JS-only check compiles. `android/` is generated, so prebuild first. Only
  # a change under clients/tv-native or to the install can reach it; the
  # Metro bundle check in `build` covers the TypeScript for everything else.
  #
  # The job id is the release job's (`tv-native` in _release-tv.yml) because
  # setup-gradle keys a Gradle home on it and falls back across workflows by
  # it: named anything else, this job restored the PHONE app's home and
  # compiled the TV app against it.
  tv-native:
    name: Android TV compile
    needs: lanes
    if: needs.lanes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'
      # Writes from main like every other cache here. Read-only, the job
      # restored a Gradle home with neither this app's dependencies nor its
      # task outputs and compiled everything (592 tasks, 74 from cache, 8.5
      # min). Dependencies and task outputs are content-hashed entries that
      # setup-gradle shares between jobs, so writing adds one small home
      # entry rather than a second copy of the set.
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '9.4.1'
          # Transforms (extracted AARs, instrumented jars) are derived from the
          # dependencies and come back in about a minute; as a cache entry they
          # were 0.6 GB per app, the largest single item in the repository's
          # 10 GB quota after the Rust trees.
          gradle-home-cache-excludes: |
            caches/transforms-*
            caches/*/transforms*
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@kromatv/tv-native' prebuild -- --platform android
      # --build-cache reuses task outputs keyed on their inputs, which the
      # dependency cache alone does not. The heap is raised because the
      # generated gradle.properties asks for 2 GB, a third of the runner.
      - run: gradle -p clients/tv-native/android assembleDebug --build-cache
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g

  # The Linux binary-engine path (mpv IPC) a macOS laptop cannot check.
  # --no-default-features leaves the in-process libmpv out: ubuntu-22.04's
  # libmpv is too old for the libmpv2 crate, and the Linux release ships the
  # binary engine anyway.
  sdk:
    name: SDK package
    needs: lanes
    if: needs.lanes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: bun install --frozen-lockfile
      - run: bun run ci sdk stage --version 0.0.0-ci.${{ github.run_number }}
      - run: bun run ci sdk smoke

  desktop:
    name: Desktop shell (cargo check)
    needs: lanes
    if: needs.lanes.outputs.desktop == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: clients/desktop/src-tauri
          shared-key: desktop-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - run: bun run ci tools tauri-deps
      - run: bun run ci build desktop
      - run: bash clients/desktop/scripts/fetch-mpv.sh
      - run: cargo check --all-targets --no-default-features
        working-directory: clients/desktop/src-tauri

  # clippy, then every test under coverage, for the workspaces this change can
  # reach (lanes works them out from the path dependencies between the server
  # and each module's workspace), split into parallel jobs: the server on its
  # own, the modules in groups. Each job keeps its own cache, saved from main
  # only (a copy per pull request is what used to evict every Rust cache).
  rust-shard:
    name: Rust (${{ matrix.shard.name }})
    needs: lanes
    if: needs.lanes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lanes.outputs.rust_shards) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: server
          cache-directories: ${{ github.workspace }}/target/kmod
          shared-key: rust-${{ matrix.shard.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile --filter '@kromatv/ci-tools'
      # Non-blocking: the codebase uses a custom import grouping, not rustfmt's.
      - run: cargo fmt --check
        if: matrix.shard.name == 'server'
        working-directory: server
        continue-on-error: true
      - run: bun run ci tools ffmpeg
      - run: bun run ci rust clippy --only "${{ join(matrix.shard.workspaces, ',') }}"
      - run: bun run ci rust test --only "${{ join(matrix.shard.workspaces, ',') }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust-${{ strategy.job-index }}
          path: server/lcov.info
          retention-days: 1
          if-no-files-found: error

  # The required check: green when every Rust job is, with their coverage in
  # one report for the scan. Skipped, like the jobs, when no Rust can be
  # reached.
  rust:
    name: Rust
    needs: [lanes, rust-shard]
    if: always() && needs.lanes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Every Rust job passed
        env:
          RESULT: ${{ needs.rust-shard.result }}
        run: |
          [[ "$RESULT" == success ]] || { echo "::error::a Rust job ended $RESULT"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-rust-*
          path: parts
      - name: One coverage report
        run: |
          mkdir -p server
          find parts -name lcov.info -exec cat {} + > server/lcov.info
          echo "$(grep -c '^SF:' server/lcov.info) files measured"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: server/lcov.info
          retention-days: 1
          if-no-files-found: error

  # The check main requires, in place of one per job. A skipped required
  # check reports as a pass, so when `lanes` failed every job behind it was
  # skipped and the run went green; here a skip passes only with its lane off.
  # A new gated job joins `needs` and LANE_OF, and branch protection never
  # changes.
  required:
    name: Required
    needs: [lanes, checks, test-report, audit, build, tv-native, sdk, desktop, rust]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile --filter '@kromatv/ci-tools'
      - run: bun run ci required
        env:
          NEEDS: ${{ toJSON(needs) }}
          LANE_OF: >-
            {"checks": "code", "test-report": "code", "audit": "code",
            "build": "fleet", "tv-native": "android", "sdk": "sdk",
            "desktop": "desktop", "rust": "rust"}

  # The scan reads the coverage the gates above produced; nothing runs twice.
  # Rust coverage is absent on a change that touched no Rust, and the scan
  # carries JS/TS coverage alone, which is what the new-code gate scores.
  sonar:
    name: SonarCloud
    needs: [lanes, checks, test-report, rust]
    if: >-
      !cancelled()
      && needs.lanes.outputs.sonar == 'true'
      && needs.test-report.result == 'success'
      && needs.rust.result != 'failure'
      && needs.rust.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Blame and new-code detection need the history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-js
          path: coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-lint-rules
          path: coverage/lint-rules
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.rust.result == 'success'
        with:
          name: coverage-rust
          path: server
      - run: bun run ci sonar prepare
      # A pull request carries its own context and the action reads it. Anything
      # else has to say which branch it is, or the analysis lands on the default
      # one: a manual run from a feature branch would otherwise overwrite main's
      # and measure its own diff against main's baseline, which counts most of
      # the repository as new code.
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        with:
          args: >-
            ${{ github.event_name != 'pull_request' &&
            format('-Dsonar.branch.name={0}', github.ref_name) || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
