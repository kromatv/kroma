name: ffmpeg
# Builds the ffmpeg every server payload ships (clients/synology/ffmpeg/): only
# what KROMA invokes, compiled in BtbN's builder image, checked against the
# commands the server runs, and published as a vendor release. Moving
# clients/synology/ffmpeg.lock onto that release is a reviewed PR, so a build
# never reaches a package on its own.
on:
  push:
    branches: [main]
    paths:
      - 'clients/synology/ffmpeg/**'
      - '.github/workflows/ffmpeg.yml'
  pull_request:
    paths:
      - 'clients/synology/ffmpeg/**'
      - '.github/workflows/ffmpeg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ffmpeg (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: clients/synology/ffmpeg/build.sh "${{ matrix.arch }}" out

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'aarch64'

      - name: Check the commands KROMA runs
        run: |
          set -euo pipefail
          mkdir -p unpacked
          tar xJf out/*.tar.xz -C unpacked
          docker run --rm --platform "${{ matrix.platform }}" -v "$PWD/unpacked":/f:ro -v "$PWD/clients/synology/ffmpeg/check.sh":/check.sh:ro \
            debian:bookworm-slim \
            sh -c 'sh /check.sh "$(ls -d /f/*/bin)" "${{ matrix.arch }}"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.arch }}
          path: out/*.tar.xz
          if-no-files-found: error

  publish:
    name: Publish the vendor release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffmpeg-*
          path: out
          merge-multiple: true

      # One release per recipe: the tag carries the hash of what decides the
      # bytes (the build script and the configure lists, not check.sh), so a
      # rebuild of the same recipe replaces nothing a lock already points at.
      - name: Release and print the lock lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recipe="$(cat clients/synology/ffmpeg/build.sh clients/synology/ffmpeg/configure*.args | sha256sum | cut -c1-12)"
          version="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' clients/synology/ffmpeg/build.sh)"
          tag="vendor-ffmpeg-kroma-$version-$recipe"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" out/*.tar.xz --prerelease --target "$GITHUB_SHA" \
            --title "vendor: ffmpeg $version (KROMA build, recipe $recipe)" \
            --notes "ffmpeg $version built by .github/workflows/ffmpeg.yml from clients/synology/ffmpeg at $GITHUB_SHA."
          {
            echo "### ffmpeg.lock"
            echo '```'
            for f in out/*.tar.xz; do
              name="$(basename "$f")"
              arch="${name##*-kroma-}"; arch="${arch%.tar.xz}"
              echo "$arch https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name $(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
