name: Kit site

# Builds the @kroma/ui workbench as a standalone site and deploys it to
# ui.kroma.tv (the `kroma-ui` assets-only Worker, clients/kit/wrangler.jsonc).
#
# The build runs on PRs too, so a change that breaks the showcase fails before
# it lands; only pushes to main deploy.
#
# Deploying needs the CLOUDFLARE_API_TOKEN repo secret (Workers Scripts: Edit).
# WITHOUT it the deploy SKIPS with a notice instead of failing red - the site
# can always be shipped by hand with `bun run deploy:kit`.
on:
  push:
    branches: [main]
    paths:
      - 'clients/kit/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'clients/tv-build/rnw.ts'
      - '.github/workflows/kit.yml'
  pull_request:
    paths:
      - 'clients/kit/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'clients/tv-build/rnw.ts'
      - '.github/workflows/kit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy (ui.kroma.tv)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Hard gate on every trigger: typecheck + vite build (the `build` script
      # runs tsc --noEmit first).
      - name: Build the kit
        run: bun run build:kit

      # Soft gate: no token -> skip (not fail). secrets can't be read in a job-
      # level if, so surface it as a step output the deploy step depends on.
      - name: Check for the Cloudflare token
        id: guard
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping the ui.kroma.tv deploy (deploy by hand with 'bun run deploy:kit')."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      # dist/ is already built above, so deploy directly rather than via the
      # workspace `deploy` script (which would rebuild it).
      - name: Deploy the kit site (ui.kroma.tv)
        if: steps.guard.outputs.has_token == 'true'
        working-directory: clients/kit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4 deploy
