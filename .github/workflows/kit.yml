name: Kit site

# Builds the @kroma/ui workbench as a standalone site and deploys it to
# ui.kroma.tv (the `kroma-ui` assets-only Worker, clients/kit/wrangler.jsonc).
#
# The build runs on PRs too, so a change that breaks the showcase fails before
# it lands; only pushes to main deploy.
#
# Deploying needs the CLOUDFLARE_API_TOKEN repo secret (Workers Scripts: Edit).
# WITHOUT it the deploy SKIPS with a notice instead of failing red - the site
# can always be shipped by hand with `bun run deploy:kit`.
#
# A push whose tree over these paths is IDENTICAL to the last successful run's
# (a re-run, a revert-of-a-revert, a merge that only touched other files after
# the filter matched) skips the whole build+deploy: the live site already
# serves those bytes. A manual dispatch always ships - it is the escape hatch
# when the Worker itself needs re-pushing.
on:
  push:
    branches: [main]
    paths:
      - 'clients/kit/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      # vite.config.ts imports @kroma/bundler/props-docs.
      - 'packages/bundler/**'
      - 'clients/tv-build/rnw.ts'
      - '.github/workflows/kit.yml'
  pull_request:
    paths:
      - 'clients/kit/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/bundler/**'
      - 'clients/tv-build/rnw.ts'
      - '.github/workflows/kit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy (ui.kroma.tv)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Push only: PRs always build (that is the gate), a dispatch always
      # ships. `changed` stays empty when skipped, and every later step treats
      # empty as "go".
      - name: Compare against the last deployed commit
        id: delta
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kit.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$last" 2>/dev/null || true
          # An unfetchable sha (force-push, expired) errors the diff -> deploy.
          if git diff --quiet "$last" HEAD -- clients/kit packages/ui packages/core packages/bundler clients/tv-build/rnw.ts .github/workflows/kit.yml 2>/dev/null; then
            echo "::notice::ui.kroma.tv is already serving this tree (last deployed $last); skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.delta.outputs.changed != 'false'
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        if: steps.delta.outputs.changed != 'false'
        run: bun install --frozen-lockfile

      # Hard gate on every trigger: typecheck + vite build (the `build` script
      # runs tsc --noEmit first).
      - name: Build the kit
        if: steps.delta.outputs.changed != 'false'
        run: bun run build:kit

      # Soft gate: no token -> skip (not fail). secrets can't be read in a job-
      # level if, so surface it as a step output the deploy step depends on.
      - name: Check for the Cloudflare token
        id: guard
        if: github.event_name != 'pull_request' && steps.delta.outputs.changed != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping the ui.kroma.tv deploy (deploy by hand with 'bun run deploy:kit')."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      # dist/ is already built above, so deploy directly rather than via the
      # workspace `deploy` script (which would rebuild it).
      - name: Deploy the kit site (ui.kroma.tv)
        if: steps.guard.outputs.has_token == 'true'
        working-directory: clients/kit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4 deploy
