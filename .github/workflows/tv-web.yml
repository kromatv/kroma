name: TV demo

# Builds the browser TV app and deploys it to tv.kroma.tv (the `kroma-tv`
# assets-only Worker, clients/tv-web/wrangler.jsonc). Until now the demo only
# updated when someone ran `bun run deploy:tv-web` by hand, so it silently
# drifted behind main.
#
# The build runs on PRs too, so a change that breaks the demo fails before it
# lands; only pushes to main deploy. Same stance as kit.yml in every respect.
#
# Deploying needs the CLOUDFLARE_API_TOKEN repo secret (Workers Scripts: Edit).
# WITHOUT it the deploy SKIPS with a notice instead of failing red - the demo
# can always be shipped by hand with `bun run deploy:tv-web`.
#
# A push whose tree over these paths is IDENTICAL to the last successful run's
# skips the whole build+deploy: the live demo already serves those bytes. A
# manual dispatch always ships - the escape hatch when the Worker itself needs
# re-pushing. Same delta gate as kit.yml.
on:
  push:
    branches: [main]
    paths:
      - 'clients/tv-web/**'
      - 'packages/tv/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/bundler/**'
      - '.github/workflows/tv-web.yml'
  pull_request:
    paths:
      - 'clients/tv-web/**'
      - 'packages/tv/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/bundler/**'
      - '.github/workflows/tv-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy (tv.kroma.tv)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Push only: PRs always build (that is the gate), a dispatch always
      # ships. `changed` stays empty when skipped, and every later step treats
      # empty as "go".
      - name: Compare against the last deployed commit
        id: delta
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tv-web.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$last" 2>/dev/null || true
          # An unfetchable sha (force-push, expired) errors the diff -> deploy.
          if git diff --quiet "$last" HEAD -- clients/tv-web packages/tv packages/ui packages/core packages/bundler .github/workflows/tv-web.yml 2>/dev/null; then
            echo "::notice::tv.kroma.tv is already serving this tree (last deployed $last); skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.delta.outputs.changed != 'false'
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        if: steps.delta.outputs.changed != 'false'
        run: bun install --frozen-lockfile

      # Hard gate on every trigger: typecheck + vite build (the `build` script
      # runs tsc --noEmit first).
      - name: Build the TV app
        if: steps.delta.outputs.changed != 'false'
        run: bun run build:tv-web

      # Soft gate: no token -> skip (not fail). secrets can't be read in a job-
      # level if, so surface it as a step output the deploy step depends on.
      - name: Check for the Cloudflare token
        id: guard
        if: github.event_name != 'pull_request' && steps.delta.outputs.changed != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping the tv.kroma.tv deploy (deploy by hand with 'bun run deploy:tv-web')."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      # dist/ is already built above, so deploy directly rather than via the
      # workspace `deploy` script (which would rebuild it).
      - name: Deploy the TV demo (tv.kroma.tv)
        if: steps.guard.outputs.has_token == 'true'
        working-directory: clients/tv-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4 deploy
