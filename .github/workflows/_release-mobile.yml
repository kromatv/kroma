name: Release mobile beta channels

# The phone/tablet client goes to the two beta channels BETA.md points testers
# at: Firebase App Distribution (Android) and TestFlight (iOS). Stable tags or
# an explicit manual run - never a nightly, which would burn a TestFlight build
# number and spam every tester.
#
# Both legs stamp the release version and a monotonic build number INTO
# app.json before `expo prebuild`, because that is the only moment the values
# reach the generated projects (the template bakes `versionCode 1` /
# `versionName` from it). Re-uploading a build number App Store Connect has
# already seen is rejected outright, so the number must never repeat.
#
# `expo prebuild` runs under NODE, never under the bun runtime: bun's runtime
# corrupts the template extraction (NUL-padded files). bun stays the package
# manager.
#
# Called by release.yml, and deliberately NOT in the publish job's `needs`: a
# beta-channel hiccup must never hold back a server release.
#
# `targets` is read straight off `github.event.inputs` rather than through a
# workflow input: in a called workflow the `github` context is still the
# CALLER's, so the gating expressions stay byte-identical to the ones these
# jobs had when they lived in release.yml.

on:
  workflow_call:
    inputs:
      version:
        description: 'Full release version (may carry a -nightly.YYYYMMDD suffix).'
        type: string
        required: true
      triplet:
        description: 'Sanitized x.y.z stamped into app.json before `expo prebuild`.'
        type: string
        required: true
      channel:
        description: 'stable | nightly | none. Only `stable` reaches the beta channels.'
        type: string
        required: true
      proceed:
        description: 'false when a nightly has nothing new to build.'
        type: string
        required: true

env:
  BUN_VERSION: '1.3.14' # keep in sync with release.yml

jobs:
  mobile-android:
    name: Mobile .apk (Firebase)
    if: ${{ inputs.proceed == 'true' && (contains(fromJSON('["stable","candidate"]'), inputs.channel) || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","mobile"]'), github.event.inputs.targets)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the Release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp version + build number into app.json
        run: node .github/scripts/stamp-mobile-version.mjs "${{ inputs.triplet }}"

      - name: Prebuild the Android project
        working-directory: clients/mobile
        run: npx expo prebuild --platform android --no-install

      # The Expo template signs `release` with the DEBUG keystore. That is fine
      # for App Distribution (it is not the Play Store), but it does mean this
      # APK and a future Play build are signed by different keys, so testers
      # would have to reinstall rather than update. Revisit when/if this ships
      # to the Play Store.
      - name: Build APK
        working-directory: clients/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/out/KROMA-mobile-${{ inputs.version }}.apk"

      - name: Upload .apk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-mobile-apk
          path: out/*.apk
          if-no-files-found: error

      # Skipped (not failed) without the secrets, like every other optional
      # signing/publishing step in this workflow: the APK is still built and
      # attached to the Release, it just is not pushed to the testers.
      # The secrets check lives INSIDE the script, not in `if:`: a step's own
      # `env:` block is not readable from its `if:` (that context is evaluated
      # first), and `secrets` is not available there at all. Same shape as the
      # optional keystore step in the Android TV job.
      - name: Distribute to Firebase App Distribution
        # See the Apple TV job: candidates build, they do not distribute.
        if: ${{ inputs.channel == 'stable' || github.event.inputs.targets == 'mobile' }}
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No FIREBASE_APP_ID / FIREBASE_SERVICE_ACCOUNT; the APK is built and"
            echo "attached to the Release, but not pushed to the testers."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools appdistribution:distribute \
            "out/KROMA-mobile-${{ inputs.version }}.apk" \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file clients/mobile/distribution/release-notes.txt \
            --groups "$FIREBASE_TESTER_GROUPS"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Attach to the Release
        # Only a STABLE release attaches here. A candidate build (push to main)
        # uploads its artifacts and stops; deploy.yml publishes them later.
        if: inputs.channel == 'stable'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: out/*.apk

  mobile-ios:
    name: Mobile .ipa (TestFlight)
    if: ${{ inputs.proceed == 'true' && (contains(fromJSON('["stable","candidate"]'), inputs.channel) || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","mobile"]'), github.event.inputs.targets)) }}
    # macos-26, NOT macos-15: Expo SDK 57 pulls Swift packages built with Swift
    # tools 6.2 (expo-modules-jsi), and the macos-15 image tops out at Xcode 16.4
    # / Swift 6.1. That mismatch fails as "Could not resolve package
    # dependencies: package 'apple' is using Swift tools version 6.2.0" thousands
    # of lines into an xcodebuild log, so the guard step below states it plainly.
    runs-on: macos-26
    permissions:
      contents: read # only reads the repo and uploads run artifacts
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      # Select the newest Xcode the image carries and assert its Swift is new
      # enough for the Expo SDK's Swift packages. Checking here turns a runner
      # image drift into one readable line instead of a package-resolution error
      # buried in a 10k-line archive log.
      - name: Select Xcode
        run: |
          set -euo pipefail
          newest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          [ -n "$newest" ] || { echo "no Xcode on this runner"; exit 1; }
          sudo xcode-select -s "$newest"
          echo "using $newest"
          xcodebuild -version
          # Part of the DerivedData cache key: a toolchain bump makes every
          # cached object file invalid, and a stale one fails deep inside a
          # 10,000-line xcodebuild log rather than at restore time.
          echo "XCODE_VERSION=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_ENV"
          swift_version=$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)
          echo "swift $swift_version"
          # Expo SDK 57's expo-modules-jsi declares swift-tools-version 6.2.
          if [ "$(printf '%s\n6.2\n' "$swift_version" | sort -V | head -1)" != "6.2" ]; then
            echo "::error::Swift $swift_version is too old for the Expo SDK (needs 6.2+). Bump the runner image."
            exit 1
          fi

      # An App Store build needs a real Apple Distribution identity and an
      # App Store provisioning profile for tv.kroma.mobile. Without them there
      # is nothing uploadable, so the whole job no-ops rather than failing the
      # release (the desktop job takes the same stance on its signing cert).
      - name: Check signing secrets
        id: signing
        env:
          IOS_CERTIFICATE: ${{ secrets.MOBILE_IOS_CERTIFICATE }}
          IOS_PROFILE: ${{ secrets.MOBILE_IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_CERTIFICATE" ] || [ -z "$IOS_PROFILE" ]; then
            echo "No MOBILE_IOS_CERTIFICATE / MOBILE_IOS_PROVISIONING_PROFILE; skipping the iOS build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.signing.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      # The archive was 16 of this job's 18 minutes, and all of it was a FULL
      # rebuild: ~700 pod sources recompiled every run to produce a binary that
      # had barely changed.
      #
      # The reason it could never be incremental is `expo prebuild`, which
      # DELETES and regenerates ios/ - Pods, project, everything - so every
      # source file arrived with a new mtime and Xcode, which invalidates on
      # mtime, rebuilt the lot. Caching Pods/ or DerivedData alone does nothing:
      # prebuild wipes them on the way past.
      #
      # So cache the GENERATED PROJECT itself and skip prebuild when its inputs
      # are unchanged. Its output is a pure function of the Expo config and the
      # native dependency set, so on a hit the restored tree is what prebuild
      # would have written - with the timestamps that make DerivedData reusable.
      #
      # EXACT key, no restore-keys: a near-miss would hand the archive a project
      # generated from a DIFFERENT config, and it would build and ship happily.
      # A miss just means the slow path, which is what today already costs.
      - name: Cache the prebuilt iOS project
        if: steps.signing.outputs.ready == 'true'
        id: ios-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            clients/mobile/ios
            ~/Library/Caches/CocoaPods
          key: ios-mobile-v1-${{ env.XCODE_VERSION }}-${{ hashFiles('bun.lock', 'clients/mobile/package.json', 'clients/mobile/app.json', 'clients/mobile/app.config.js') }}

      # AFTER the cache, deliberately. This rewrites app.json with a build
      # number derived from the clock, so hashing it would change the cache key
      # every minute and guarantee a miss forever.
      - name: Stamp version + build number into app.json
        if: steps.signing.outputs.ready == 'true'
        run: node .github/scripts/stamp-mobile-version.mjs "${{ inputs.triplet }}"

      - name: Prebuild the iOS project
        if: steps.signing.outputs.ready == 'true' && steps.ios-cache.outputs.cache-hit != 'true'
        working-directory: clients/mobile
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install

      # The version/build number is stamped into app.json BEFORE the cache key is
      # computed, so a restored project carries the previous run's build number
      # in its Info.plist. Apple refuses a duplicate (version, build) pair on
      # upload, so re-stamp the generated project rather than rebuild it.
      # A restored project carries the build number of the run that cached it,
      # and App Store Connect refuses a (version, build) pair it has already
      # seen. Read back exactly what the stamp step wrote so the two cannot
      # drift.
      - name: Re-stamp the restored project
        if: steps.signing.outputs.ready == 'true' && steps.ios-cache.outputs.cache-hit == 'true'
        working-directory: clients/mobile
        run: |
          set -euo pipefail
          ver=$(node -p "require('./app.json').expo.version")
          build=$(node -p "require('./app.json').expo.ios.buildNumber")
          plist=ios/KROMA/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $ver" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$plist"
          echo "re-stamped $plist -> $ver ($build)"

      - name: Import certificate + provisioning profile
        if: steps.signing.outputs.ready == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.MOBILE_IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.MOBILE_IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.MOBILE_IOS_PROVISIONING_PROFILE }}
        run: .github/scripts/ios-import-signing-assets.sh

      # DerivedData is cached SEPARATELY from the project above, and with
      # restore/save rather than `cache`, because the two differ in the one way
      # that matters: the generated project is immutable for a given config,
      # while these object files change on every commit. actions/cache does not
      # re-save a key that already hit - so sharing one entry froze DerivedData
      # at whatever the first run stored (nothing), and the archive stayed a
      # full rebuild while the cache reported a hit.
      #
      # Unique key per run + a prefix restore-key: every run restores the most
      # recent objects and saves its own, which is what makes the compile
      # incremental instead of merely cached.
      - name: Restore DerivedData
        if: steps.signing.outputs.ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived/mobile
          key: dd-mobile-v1-${{ env.XCODE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            dd-mobile-v1-${{ env.XCODE_VERSION }}-
            dd-mobile-v1-

      - name: Archive + export .ipa
        if: steps.signing.outputs.ready == 'true'
        working-directory: clients/mobile/ios
        env:
          DERIVED_DATA: ${{ github.workspace }}/.derived/mobile
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
          # Authenticates `-allowProvisioningUpdates`: the Expo template leaves
          # the project on automatic signing, so xcodebuild resolves the App
          # Store profile itself and cannot do it anonymously.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        # Called by absolute path: this step runs from clients/mobile/ios.
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ios-archive-export-ipa.sh"


      # An App Store Connect API key is preferred; the app-specific password
      # the desktop job already uses for notarization is the fallback.
      # Trimmed first: the repo's 10GB cache budget already holds ~2.5GB of Rust
      # and ~1.2GB of Gradle, and an untrimmed pair of Apple projects would evict
      # them by LRU. Intermediates.noindex is the part worth keeping - it is the
      # object files; the rest regenerates in seconds.
      - name: Trim and save DerivedData
        if: always() && steps.signing.outputs.ready == 'true'
        run: |
          dd=.derived/mobile
          [ -d "$dd" ] || { echo "no DerivedData at $dd"; exit 0; }
          rm -rf "$dd/ModuleCache.noindex" "$dd/Index.noindex" "$dd/Logs" \
                 "$dd/Build/Products" "$dd/SourcePackages/checkouts" || true
          echo "DerivedData now $(du -sh "$dd" | cut -f1)"

      - name: Save DerivedData
        if: always() && steps.signing.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived/mobile
          key: dd-mobile-v1-${{ env.XCODE_VERSION }}-${{ github.run_id }}

      - name: Upload to TestFlight
        # See the Apple TV job: candidates build, they do not distribute.
        if: ${{ steps.signing.outputs.ready == 'true' && (inputs.channel == 'stable' || github.event.inputs.targets == 'mobile') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          IPA="out/KROMA-mobile-${{ inputs.version }}.ipa"
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            printf '%s' "$ASC_PRIVATE_KEY" \
              > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
            rm -rf "$HOME/.appstoreconnect"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ]; then
            xcrun altool --upload-app -f "$IPA" -t ios -u "$APPLE_ID" -p "$APPLE_PASSWORD"
          else
            echo "No App Store Connect credentials; the .ipa is built but not uploaded."
          fi

      - name: Upload .ipa artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-mobile-ipa
          path: out/*.ipa
          if-no-files-found: error
