name: Synology

# Everything for the server deliverables in ONE workflow:
#   tag vX.Y.Z  -> build the stable .spk + attach it (+ its .info.json sidecar)
#                  to that GitHub Release
#   push main   -> build a canary .spk -> rolling `nightly` prerelease
#   either      -> push the MULTI-ARCH Docker image (linux/amd64 + linux/arm64)
#                  ASSEMBLED FROM static musl binaries + the web SPA (no
#                  from-source docker compile): amd64 reuses the .spk payload,
#                  arm64 comes from its own cross-compile job (Raspberry Pi
#                  4/5 and other ARM64 hosts)
#
# The package source is the DYNAMIC Cloudflare Worker at packages.kroma.tv
# (apps/packages); it reads releases + the .info.json sidecars
# straight from the GitHub API, so it needs NO deploy here. Stable + nightly
# share one build job (only the version differs).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: synology-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.14'

jobs:
  # Cheap gate: skip the whole build for main pushes that cannot change the
  # .spk/Docker image (TV-only, desktop-only, docs commits). Tags and manual
  # runs always build.
  changes:
    name: Detect relevant changes
    permissions:
      contents: read
    # Branch pushes only: tags/dispatch always build, and dorny's diff base is
    # undefined on tag pushes.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.f.outputs.relevant }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: f
        with:
          filters: |
            relevant:
              - 'server/**'
              # The server binary path-deps scene, whisper and vector from here.
              - 'modules/**'
              - 'clients/web/**'
              - 'clients/synology/**'
              - 'packages/**'
              - 'bun.lock'
              - '.github/workflows/synology.yml'

  build:
    name: Build .spk
    needs: changes
    permissions:
      contents: read
    # `always()` so the SKIPPED changes job (dispatch) still lets the dispatch
    # leg run; a main push only builds when relevant files changed. The old
    # `github.ref == 'refs/heads/main'` clause is gone: it was true on EVERY
    # main push, which made the changes gate dead code and cold-built the .spk
    # for TV-only and docs commits.
    if: >-
      always() && !cancelled()
      && (github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Tag -> that version minus the leading `v`. main / dispatch -> empty, so
      # build.sh derives it from server/Cargo.toml and stamps the nightly build.
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Static ffmpeg + musl cargo registry + THE MUSL TARGET DIR. Without the
      # target dir every push cold-compiled the whole workspace (candle,
      # librqbit, ...) for ~10 min; warm, only changed crates rebuild. The
      # version-bump commit changes Cargo.lock, so restore-keys fall back to
      # the newest previous cache.
      - name: Cache build inputs + musl target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            clients/synology/.cache
            server/target/x86_64-unknown-linux-musl
            server/target/release
          key: synology-v2-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            synology-v2-
            synology-

      # build.sh: web SPA -> static musl kroma-server -> static ffmpeg -> .spk.
      - name: Build .spk
        run: clients/synology/build.sh ${{ steps.ver.outputs.version }}

      # The Docker musl build writes root-owned files into the cache + target;
      # hand them back so actions/cache can save (else it fails silently and
      # never persists - which is exactly why the old cache stayed cold).
      - name: Fix cache permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" clients/synology/.cache server/target || true

      # Sidecar consumed by the dynamic package-source worker: version, md5,
      # size, description read out of the .spk itself.
      - name: Generate .info.json sidecar
        run: |
          SPK="$(ls clients/synology/dist/*.spk | head -1)"
          bun packages/synology-repo/src/gen-spk-info.ts "$SPK"

      - name: Upload .spk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-synology-spk
          path: |
            clients/synology/dist/*.spk
            clients/synology/dist/*.spk.info.json
          if-no-files-found: error

      # The web SPA is a side effect of build.sh publish it for any static host.
      - name: Upload web SPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-web
          path: clients/web/dist/client
          if-no-files-found: error

  # The arm64 half of the Docker image: same single-binary model as the .spk
  # (static musl kroma-server + static ffmpeg), cross-compiled in the aarch64
  # flavor of the exact toolchain image the .spk build uses. No ARM .spk is
  # published (ARM DSM models are too weak to matter); this payload only feeds
  # the linux/arm64 image, which covers Raspberry Pi 4/5 and other ARM64 hosts.
  # The web SPA is arch-independent and reused from the .spk payload.
  arm64:
    name: Build arm64 payload
    needs: changes
    permissions:
      contents: read
    # Same gate as `build` above: dispatch always, main pushes only on
    # relevant changes.
    if: >-
      always() && !cancelled()
      && (github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET: aarch64-unknown-linux-musl
      # Digest-pinned like the x86_64 image in clients/synology/build.sh: a
      # moving tag swaps rustc underneath and invalidates the cached target dir.
      RUST_IMAGE: messense/rust-musl-cross:aarch64-musl@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643
      FFMPEG_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
      # Same stance as build.sh's amd64 pair: the primary stays first, and BtbN's
      # GPL static build (different machine, different network) only decides
      # whether an outage of the primary costs a nightly.
      FFMPEG_FALLBACK_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Same warm-target rationale as the .spk cache above, per-arch key.
      # ffmpeg-arm64 rides along (v2 bump so it starts being saved): the static
      # tarball comes from a host that goes down for whole days, and a cached
      # copy turns that outage into a non-event.
      - name: Cache cargo registry + aarch64 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-registry
            server/target/aarch64-unknown-linux-musl
            ffmpeg-arm64
          key: synology-arm64-v2-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: |
            synology-arm64-v2-
            synology-arm64-v1-

      # Mirrors clients/synology/build.sh step 2: server/ -> /home/rust/src
      # (WORKDIR), packages/ -> /home/rust/packages (i18n.rs include_str!s the
      # shared locale catalogs from outside server/), cargo registry cached.
      - name: Cross-compile kroma-server (aarch64 musl)
        run: |
          mkdir -p .cargo-registry
          docker run --rm \
            -v "$PWD":/home/rust/repo \
            -w /home/rust/repo/server \
            -v "$PWD/.cargo-registry":/root/.cargo/registry \
            "$RUST_IMAGE" \
            cargo build --release --locked --target "$TARGET" --features whisper-local

      # The container runs as root; hand the tree back so actions/cache can save.
      - name: Fix cache permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" server/target .cargo-registry || true

      # Mirrors build.sh's fetch_ffmpeg, which this step predated: without
      # --connect-timeout a host accepting no connections was retried at ~135 s
      # per attempt (an outage burned 24 minutes and failed anyway), and without
      # the fallback that outage cost the whole payload. Extraction goes through
      # `find` because the two archives disagree on layout (root vs bin/), and
      # the arch check is by inspection - an arm64 binary cannot run here.
      - name: Fetch static ffmpeg/ffprobe (arm64)
        run: |
          set -euo pipefail
          if [ -x ffmpeg-arm64/ffmpeg ] && [ -x ffmpeg-arm64/ffprobe ]; then
            echo "using the cached ffmpeg-arm64"
            exit 0
          fi
          # `xz -t` is part of the fetch, not a separate step: the primary has
          # served an HTML error page WITH HTTP 200 (2026-07-31, coming back
          # from an outage), which -f waves through and tar then dies on -
          # before the fallback was ever consulted. A fetch only counts when
          # what arrived is actually an xz archive.
          fetch() {
            curl -fSL --connect-timeout 20 --retry 3 --retry-delay 4 --retry-all-errors \
              --proto '=https' --proto-redir '=https' "$1" -o ff.tar.xz \
              && xz -t ff.tar.xz 2>/dev/null
          }
          if ! fetch "$FFMPEG_URL"; then
            echo "primary ffmpeg source unreachable, trying the fallback"
            fetch "$FFMPEG_FALLBACK_URL" || { echo "both ffmpeg sources failed"; exit 1; }
          fi
          mkdir -p ffx ffmpeg-arm64
          tar xJf ff.tar.xz -C ffx
          for tool in ffmpeg ffprobe; do
            found="$(find ffx -type f -name "$tool" -perm -u+x -print -quit)"
            [ -n "$found" ] || { echo "$tool missing from the ffmpeg archive"; exit 1; }
            file "$found" | grep -qiE 'aarch64|arm' || { echo "$tool is not an arm64 binary"; exit 1; }
            install -m755 "$found" "ffmpeg-arm64/$tool"
          done

      - name: Stage the arm64 payload
        run: |
          set -euo pipefail
          mkdir -p payload/bin payload/ffmpeg
          install -m755 "server/target/$TARGET/release/kroma-server" payload/bin/kroma-server
          install -m755 ffmpeg-arm64/ffmpeg payload/ffmpeg/ffmpeg
          install -m755 ffmpeg-arm64/ffprobe payload/ffmpeg/ffprobe

      - name: Upload arm64 payload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-linux-arm64
          path: payload
          if-no-files-found: error

  # The Docker image is ASSEMBLED from prebuilt payloads (static musl binaries +
  # web SPA + static ffmpeg), not compiled again: this replaced a ~13-minute
  # from-source docker.yml build with a copy + push. linux/amd64 reuses the .spk
  # payload, linux/arm64 the payload from the arm64 job; Dockerfile.runtime
  # picks per platform via TARGETARCH. Runs for main pushes and tags alike,
  # same tag scheme as before (latest + <version> on main, semver on tags).
  docker:
    name: Docker image (multi-arch, from prebuilt payloads)
    needs: [build, arm64]
    # `changes` is skipped on tag pushes, and that "skipped" propagates through
    # `build` to this job unless we override the default success() gate. Run
    # whenever both payload builds actually succeeded (tags + relevant pushes).
    if: always() && !cancelled() && needs.build.result == 'success' && needs.arm64.result == 'success'
    permissions:
      contents: read
      packages: write # push the Docker image to ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kroma-synology-spk
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kroma-linux-arm64
          path: arm64-payload

      # Context layout Dockerfile.runtime expects: web/ shared (arch-independent
      # SPA from the .spk payload) + one bin/ + ffmpeg/ pair per TARGETARCH.
      - name: Assemble the multi-arch build context
        id: payload
        run: |
          set -euo pipefail
          SPK="$(ls dist/*.spk | head -1)"
          mkdir -p spk-payload docker-ctx/amd64 docker-ctx/arm64
          tar -xOf "$SPK" package.tgz | tar -xz -C spk-payload
          mv spk-payload/web docker-ctx/web
          mv spk-payload/bin spk-payload/ffmpeg docker-ctx/amd64/
          mv arm64-payload/bin arm64-payload/ffmpeg docker-ctx/arm64/
          chmod +x docker-ctx/*/bin/* docker-ctx/*/ffmpeg/*
          # Diagnostic only: `|| true` so the SIGPIPE `ls` takes when `head`
          # closes the pipe early can't trip `set -o pipefail` and fail the step.
          ls -R docker-ctx | head -20 || true
          # INFO version from the filename: kroma-<version>-x86_64.spk
          NAME="$(basename "$SPK")"; V="${NAME#kroma-}"; V="${V%-x86_64.spk}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # qemu: the runner is amd64; the arm64 leg's RUN steps (apt-get) execute
      # emulated. The kroma binaries themselves are prebuilt, only COPYed.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.payload.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-ctx
          file: server/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # There is no attach-to-the-stable-release job here any more. This workflow
  # used to run on tags and upload the .spk itself, which had two costs. It
  # rebuilt the package, so the bytes on the Release were not the bytes anyone
  # had tested; and its softprops call was the one in the repo without
  # `draft: true`, so uploading PUBLISHED the release - from a workflow that
  # knows nothing about whether the other platforms built. That is how v0.1.35
  # went live at 15:46:16 with both .ipa builds failing and its own publish job
  # still gated behind them.
  #
  # deploy.yml now takes `kroma-synology-spk` from the main-push run for the
  # commit being promoted, so the .spk on a Release is the artifact that was
  # built and approved rather than a same-source rebuild.

  # main -> rolling `nightly` prerelease, one asset per build, named for the
  # version it carries. It used to be a single fixed name clobbered on every
  # push: DSM records the md5 it read from the catalog and verifies the bytes it
  # downloads against that, so the next push silently made every already-listed
  # build uninstallable ("Failed to verify the package ... by MD5"). A build now
  # keeps its own URL until it ages out, and a client holding a slightly stale
  # catalog still downloads bytes whose md5 matches. The .info.json sidecar
  # rides along so the dynamic source knows the real nightly version + md5
  # without downloading the .spk.
  #
  # Retention is by AGE, not by count. It was "keep the newest two", which is a
  # window measured in BUILDS while the thing that outlives it - the catalog
  # worker's stale copy - is measured in DAYS (604800s in apps/packages
  # lib/catalog.ts, served whenever the GitHub API call fails). Two pushes eight
  # minutes apart were enough to delete an asset a live catalog still pointed at,
  # which is what made packages.kroma.tv hand out 404s. KEEP_DAYS must stay
  # comfortably above that stale window; the floor keeps the last few builds
  # whatever their age, so a quiet fortnight cannot empty the release.
  publish-nightly:
    name: Publish nightly prerelease
    if: always() && !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write # create/update the rolling nightly release + assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kroma-synology-spk
          path: dist
      - name: Upload to the nightly prerelease
        run: |
          SPK="$(ls dist/*.spk | head -1)"
          NAME="$(basename "$SPK")"
          bun packages/synology-repo/src/gen-spk-info.ts "$SPK" --beta
          gh release view nightly >/dev/null 2>&1 \
            || gh release create nightly --prerelease --title "KROMA nightly" \
                 --notes "Rolling nightly build from main. Unstable; auto-updates via the nightly package source."
          gh release upload nightly "$SPK" "$SPK.info.json" --clobber

          # Older than KEEP_DAYS *and* outside the newest KEEP_MIN. Both have to
          # hold, so neither a burst of pushes nor a quiet fortnight can strand a
          # catalog that still advertises one of these URLs.
          KEEP_DAYS=14
          KEEP_MIN=5
          CUTOFF="$(date -u -d "${KEEP_DAYS} days ago" +%s)"
          gh api "repos/${GH_REPO}/releases/tags/nightly" \
            --jq '.assets[] | select(.name | endswith(".spk")) | [.name, .created_at] | @tsv' \
            | awk -F'\t' -v cur="$NAME" '$1 != cur' | sort -Vr | tail -n "+${KEEP_MIN}" \
            | while IFS="$(printf '\t')" read -r OLD CREATED; do
                [ -n "$OLD" ] || continue
                if [ "$(date -u -d "$CREATED" +%s)" -lt "$CUTOFF" ]; then
                  echo "pruning $OLD (created $CREATED)"
                  gh release delete-asset nightly "$OLD" -y || true
                  gh release delete-asset nightly "$OLD.info.json" -y || true
                fi
              done
