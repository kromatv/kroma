name: Release TV clients

# TV half of the release fleet, called by release.yml: the native Samsung .tpk
# and LG .ipk (clients/tv-native, through react-native-tizen and
# react-native-webos), and the web Samsung .wgt and LG .ipk they replace on
# every set that can run them. Never triggered on its own; the version/channel
# decisions all come from the caller's `version` job. Android TV is in
# _release-androidtv.yml, so that Google Play does not wait for these.
#
# The web packages stay for the sets the native ones cannot reach: Samsung
# refuses the native library a .tpk carries below Tizen 6.0 (2017-2020 models),
# and the web .ipk is the fallback while the native LG app is an alpha.
#
# `targets` is read straight off `github.event.inputs` rather than through a
# workflow input: in a called workflow the `github` context is still the
# CALLER's, so the gating expression stays byte-identical to the one these jobs
# had when they lived in release.yml.

on:
  workflow_call:
    inputs:
      version:
        description: 'Full release version.'
        type: string
        required: true
      triplet:
        description: 'Sanitized x.y.z the TV stores require (appinfo.json / config.xml reject suffixes).'
        type: string
        required: true
      build:
        description: 'The monotonic build number every store-bound package in this run carries (minutes since 2020).'
        type: string
        required: true

jobs:
  webos:
    name: webOS .ipk (web, modern + legacy tiers)
    if: ${{ (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds BOTH tiers (modern ESM + legacy ES2015/flattened CSS + the
      # runtime engine gate in index.html) and runs the Chromium-53 compat guard.
      - name: Build (production, both tiers)
        run: bun run build:webos

      # webOS requires a plain x.y.z in appinfo.json.
      - name: Stamp version ${{ inputs.triplet }}
        run: |
          node -e "const f='clients/webos/dist/appinfo.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='${{ inputs.triplet }}';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      # ares-package needs no signing; TVs install the .ipk via the Dev Mode app.
      # --no-minify: the bundles are already minified by Vite, and ares' own
      # (ancient) minifier cannot parse modern ES2020 output (hls.js chunk).
      - name: Package .ipk
        run: |
          # Pinned: an unlocked `npm install -g` would silently change the
          # packager between releases, and an .ipk is not something to
          # rebuild differently on a whim.
          npm install -g @webos-tools/cli@3.1.2
          ares-package clients/webos/dist -o clients/webos/out --no-minify

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-webos-ipk
          path: clients/webos/out/*.ipk
          if-no-files-found: error
          retention-days: 30

  tizen:
    name: Tizen .wgt (web, dev-certificate signed)
    if: ${{ (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      TIZEN_STUDIO_VER: '6.0'
      # Throwaway author certificate generated per run: Samsung TVs in developer
      # mode accept any author cert (re-installing over an app signed with a
      # DIFFERENT cert requires uninstalling it first).
      TIZEN_CERT_PASS: kromaci-2026
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (production)
        run: bun run build:tizen

      # Tizen requires a plain x.y.z in config.xml (the <widget> tag, line 2).
      - name: Stamp version ${{ inputs.triplet }}
        run: |
          sed -i -E 's/(<widget[^>]*version=")[^"]*/\1${{ inputs.triplet }}/' clients/tizen/dist/config.xml
          grep -o 'version="[^"]*"' clients/tizen/dist/config.xml | head -1

      # Downloaded every run rather than cached: the 259 MB installer restored
      # no faster than it downloads, and the install itself is the slow part.
      - name: Install Tizen Studio CLI
        run: |
          # --max-redirect=0: the URL serves the installer directly (200, no
          # hops), so nothing legitimate needs a redirect - and refusing them
          # outright is what stops one being pointed somewhere else.
          # --https-only backs it up: TLS cannot be downgraded to plain http.
          wget -q --https-only --max-redirect=0 --tries=3 --waitretry=10 -O web-cli.bin "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x web-cli.bin
          ./web-cli.bin --accept-license --no-java-check "$HOME/tizen-studio"
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"

      - name: Create signing profile (throwaway author certificate)
        run: |
          tizen certificate -a KROMA -p "$TIZEN_CERT_PASS" -f kroma-ci
          tizen security-profiles add -n kroma-ci \
            -a "$HOME/tizen-studio-data/keystore/author/kroma-ci.p12" -p "$TIZEN_CERT_PASS"
          # The CLI records password FILE references it cannot read back in a
          # headless run; inline the plaintext passwords (no-ops if not present).
          P="$HOME/tizen-studio-data/profile/profiles.xml"
          sed -i "s|password=\"[^\"]*kroma-ci\.pwd\"|password=\"$TIZEN_CERT_PASS\"|g" "$P"
          sed -i "s|password=\"[^\"]*tizen-distributor-signer\.pwd\"|password=\"tizenpkcs12passfordsigner\"|g" "$P"

      # Four packages from the one build (clients/tizen/scripts/package-all.ts):
      # KROMA-tizen-<v>.wgt carries every tier and chooses at runtime, which is
      # what a Store submission needs; KROMA-tizen8-, KROMA-tizen4to7- and
      # KROMA-tizen3- are one tier each, for a set whose Tizen version is known,
      # so a 2024 model does not download two bundles it can never run. Each
      # slice floors its manifest at its own Tizen version, so the wrong one
      # refuses to install rather than showing a black screen. The version is
      # in the name because `tizen package` names every build KROMA.wgt.
      - name: Package the .wgt files
        env:
          TIZEN_PROFILE: kroma-ci
        run: |
          bun run --filter '@kromatv/tizen' package:all
          ls -l clients/tizen/out

      - name: Upload .wgt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-tizen-wgt
          path: clients/tizen/out/*.wgt
          if-no-files-found: error
          retention-days: 30

  # The native Samsung app: Hermes and Fabric in a .NET shell, armv7, for Tizen
  # 6.0 (2021) and every later set. One CPU per package, and armv7 is the
  # userland Samsung's sets run.
  tizen-native:
    name: Tizen .tpk (native)
    if: ${{ (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo and uploads run artifacts
      actions: write # retires the previous compiler cache entry
    timeout-minutes: 120
    env:
      KROMA_VERSION: ${{ inputs.triplet }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      # Tizen Studio is never installed: the build reads two of its packages,
      # the IoT Headed 6.0 rootstrap it links against and the GCC 14.2 runtime
      # it links in, fetched by the checksums Tizen's package lists give.
      TIZEN_PACKAGES: >-
        https://download.tizen.org/sdk/extensions/Tizen_IoT_Headed/binary/iot-headed-6.0-rs-device.core_0.0.78_ubuntu-64.zip=8cd90f988c43a6a83be24aef8e8853a5cd7153685e2e783268b46c9522cb01d8
        https://download.tizen.org/sdk/tizenstudio/official/binary/cross-arm-gcc-14.2_0.2.16_ubuntu-64.zip=12c3aab23ff45d03d1b8b36d05cd4970d2ff7210b1940194320ce5e33e924bbd
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang lld llvm cmake ninja-build ccache
          clang --version | head -1
          dotnet --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch the Tizen rootstrap and GCC runtime
        run: |
          sdk="$RUNNER_TEMP/tizen-sdk"
          zips="$RUNNER_TEMP/tizen-zips"
          mkdir -p "$sdk" "$zips"
          for entry in $TIZEN_PACKAGES; do
            url="${entry%=*}"
            sum="${entry##*=}"
            zip="$zips/${url##*/}"
            wget -q --https-only --max-redirect=0 --tries=3 --waitretry=10 -O "$zip" "$url"
            echo "$sum  $zip" | sha256sum -c -
            unzip -q -o "$zip" 'data/*' -d "$sdk"
            rm "$zip"
          done
          touch "$sdk/data/sdk.version"
          echo "TIZEN_SDK_DIR=$sdk/data" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            ~/.cache/react-native-tizen/downloads
          key: tizen-native-v1-${{ github.run_id }}
          restore-keys: tizen-native-v1-

      # Signed with a self-signed pair made for this run: a retail set takes only
      # the certificates Samsung issued for it, so every install signs the
      # package again (the installer does it on its own).
      - name: Package .tpk
        working-directory: clients/tv-native
        run: |
          bunx rn-tv tizen certificate create-author kroma-ci
          certificate="${XDG_STATE_HOME:-$HOME/.local/state}/react-native-tizen/certificates/kroma-ci"
          password="$(cat "$certificate/author.pwd")"
          echo "::add-mask::$password"
          export RN_TIZEN_AUTHOR_PASSWORD="$password" RN_TIZEN_DISTRIBUTOR_PASSWORD="$password"
          bunx rn-tv tizen package --arch armv7l --platform 6.0 \
            --author "$certificate/author.p12" --distributor "$certificate/author.p12"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp tizen/bin/Release/*/tv.kroma.app-*.tpk "$GITHUB_WORKSPACE/out/KROMA-tizen-${{ inputs.version }}.tpk"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            ~/.cache/react-native-tizen/downloads
          key: tizen-native-v1-${{ github.run_id }}

      - name: Retire the previous compiler cache entry
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun run ci cache prune --prefix tizen-native-v1- --keep 1

      - name: Upload .tpk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-tizen-tpk
          path: out/*.tpk
          if-no-files-found: error
          retention-days: 30

  # The native LG app: one 32-bit ARM executable, for webOS TV 4 (2018) and
  # every later set. Nothing from LG is installed: rn-webos downloads the
  # openlgtv sysroot it links against and writes the .ipk itself, unsigned.
  webos-native:
    name: webOS .ipk (native)
    if: ${{ (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo and uploads run artifacts
      actions: write # retires the previous compiler cache entry
    timeout-minutes: 120
    env:
      KROMA_VERSION: ${{ inputs.triplet }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install the build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang lld llvm cmake ninja-build ccache
          clang --version | head -1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            ~/.cache/react-native-webos/downloads
          key: webos-native-v1-${{ github.run_id }}
          restore-keys: webos-native-v1-

      - name: Package .ipk
        working-directory: clients/tv-native
        run: |
          bunx rn-tv webos package
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp webos/tv.kroma.app_*_arm.ipk "$GITHUB_WORKSPACE/out/KROMA-webos-${{ inputs.version }}.ipk"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            ~/.cache/react-native-webos/downloads
          key: webos-native-v1-${{ github.run_id }}

      - name: Retire the previous compiler cache entry
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun run ci cache prune --prefix webos-native-v1- --keep 1

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-webos-native-ipk
          path: out/*.ipk
          if-no-files-found: error
          retention-days: 30
