name: Prepare Google Play releases

# One listing, two form factors. Upload sequentially: committing a Play edit
# invalidates other open edits. Each variable names one or more testing tracks,
# comma-separated, and every one of them gets the bundle as a finished release:
# internal testers have it at once, a closed track after Google's review.
# Production is refused.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

concurrency:
  group: google-play-tv-kroma-app
  cancel-in-progress: false

jobs:
  play:
    name: Mobile + Android TV releases
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'release' || '' }}
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    steps:
      - name: Check Play configuration
        id: configuration
        env:
          PLAY_STORE_READY: ${{ vars.PLAY_STORE_READY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_MOBILE_TRACK: ${{ vars.PLAY_MOBILE_TRACK }}
          PLAY_TV_TRACK: ${{ vars.PLAY_TV_TRACK }}
        run: |
          if [[ "$PLAY_STORE_READY" != true ]]; then
            echo 'Play uploads are not activated; signed bundles remain available as build artifacts.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" || -z "$PLAY_MOBILE_TRACK" || -z "$PLAY_TV_TRACK" ]]; then
            echo '::error::Play uploads need the service account and both form-factor track IDs.'
            exit 1
          fi
          refuse() {
            echo "::error::$1"
            exit 1
          }
          IFS=, read -ra mobile <<< "$PLAY_MOBILE_TRACK"
          IFS=, read -ra tv <<< "$PLAY_TV_TRACK"
          for track in "${mobile[@]}"; do
            [[ -n "$track" && "$track" != *:* ]] || refuse "PLAY_MOBILE_TRACK: \"$track\" is not a mobile track."
            [[ "$track" != production ]] || refuse 'PLAY_MOBILE_TRACK names production; CI releases to testing tracks only.'
          done
          for track in "${tv[@]}"; do
            [[ "$track" == tv:?* ]] || refuse "PLAY_TV_TRACK: \"$track\" is not a tv: track."
            [[ "$track" != tv:production ]] || refuse 'PLAY_TV_TRACK names tv:production; CI releases to testing tracks only.'
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "mobile: $PLAY_MOBILE_TRACK; TV: $PLAY_TV_TRACK"

      - name: Download mobile bundle
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kroma-mobile-aab
          path: play/mobile

      - name: Download Android TV bundle
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kroma-androidtv-aab
          path: play/tv

      - name: Release mobile
        if: steps.configuration.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: tv.kroma.app
          releaseFiles: play/mobile/*.aab
          releaseName: KROMA ${{ inputs.version }} mobile
          tracks: ${{ vars.PLAY_MOBILE_TRACK }}
          status: completed

      - name: Release Android TV
        if: steps.configuration.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: tv.kroma.app
          releaseFiles: play/tv/*.aab
          releaseName: KROMA ${{ inputs.version }} Android TV
          tracks: ${{ vars.PLAY_TV_TRACK }}
          status: completed
