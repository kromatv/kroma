name: Build & Release

# Every push to main builds EVERY client artifact for the version
# server/Cargo.toml is currently on, and publishes NOTHING. deploy.yml promotes
# one of those runs to a Release behind an approval.
#
# It used to be the tag that triggered this, which meant a version number was
# spent to find out whether the pipeline worked. Two releases in a row were lost
# that way. Now a candidate can be rebuilt as many times as it takes - same
# version, new run - and the number is only claimed once something good exists
# to attach it to.
#
# It is also what makes the build fast enough to run on every push. GitHub scopes
# a cache to the ref that wrote it, and a tag gets its OWN scope, so releases
# never reused each other's caches: `No cache found`, ~2GB of Rust rebuilt from
# scratch every time. Building on main writes to refs/heads/main, which every
# later run can read.
#
# The artifact set:
#   - Synology .spk (server + web SPA + ffmpeg, x86_64 musl)
#   - Desktop installers (macOS .dmg, Windows .exe/.msi, Linux .AppImage/.deb)
#   - LG webOS .ipk - ONE package carrying BOTH tiers (modern Chrome 99+ AND the
#     legacy Chromium 53-94 bundle for 2018-2023 TVs, runtime-gated)
#   - Samsung Tizen .wgt (signed with a throwaway author certificate; TVs in
#     developer mode accept it)
#   - Android TV .apk (release-signed when the keystore secrets are set, else
#     debug-signed for sideloading)
#   - Apple TV .ipa, to TestFlight. Its own called workflow rather than a fourth
#     job in the TV one, because unlike the .ipk/.wgt/.apk it is not a file a
#     tester can sideload.
#   - Mobile .apk + .ipa, pushed to the two beta channels BETA.md points testers
#     at (Firebase App Distribution, TestFlight).
#   - Module bundles (.kmod, zstd, one per build target) + modules.json: the
#     machine-readable store catalog the in-app Admin -> Modules Store browses
#     via releases/latest/download/modules.json
#
# All bundles are PRODUCTION builds: `vite build`, console/debugger stripped by
# the shared TV shell factory, no KROMA_TV_DEVICE dev mode.
#
# NIGHTLY channel: the nightly schedule (or a manual run with publish=nightly)
# builds the SAME artifact set versioned `X.Y.Z-nightly.YYYYMMDD` and publishes
# it to the rolling `nightly` prerelease (which also carries the per-push canary
# .spk from synology.yml). Nights with no new commits on main skip everything
# (~30s guard run). The nightly is the one channel that still publishes from
# here, because it costs no version number to get wrong.
#
# Manual runs build artifacts without publishing a Release; `targets` scopes the
# run (all | spk | desktop | tv | modules).
#
# The per-platform build jobs live in reusable workflows (_release-*.yml) that
# this file calls; the calling job here carries the SAME gate as the jobs it
# wraps, so a skipped platform still propagates a skip to the candidate gate -
# and deploy.yml refuses to promote a run whose gate did not pass.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0). Defaults to server/Cargo.toml.'
        required: false
      targets:
        description: 'What to build'
        type: choice
        options: [all, spk, desktop, tv, mobile, modules]
        default: all
        required: false
      publish:
        description: 'Publish the artifacts (none = build only)'
        type: choice
        options: [none, nightly]
        default: none
        required: false
      distribute:
        description: 'Also push the mobile/TV builds to TestFlight + Firebase'
        type: boolean
        default: false
        required: false

# Candidates supersede; nightlies queue.
#
# This used to queue unconditionally, because a superseded run could leave a
# partially-uploaded Release. That reason is gone: a candidate build publishes
# NOTHING - deploy.yml does - so the only thing a superseded candidate can lose
# is a result nobody wants any more. Queuing them cost real time; four pushes in
# an afternoon meant the fourth waited an hour behind three builds of code that
# had already been replaced.
#
# The nightly still publishes from here, so it keeps the old behaviour: `push`
# is the candidate leg, `schedule` is the nightly one.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  BUN_VERSION: '1.3.14'

jobs:
  # One version for every artifact: the tag, the manual input, or the
  # server/Cargo.toml base. `triplet` is the sanitized x.y.z the TV stores
  # require (appinfo.json / config.xml reject suffixes). Also decides the
  # channel (stable tag / nightly / build-only) and, for nightlies, whether
  # there is anything new to build (proceed=false when main hasn't moved since
  # the last published nightly-manifest.json).
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo and uploads run artifacts
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      triplet: ${{ steps.v.outputs.triplet }}
      channel: ${{ steps.v.outputs.channel }}
      proceed: ${{ steps.v.outputs.proceed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: v
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ github.event.inputs.publish }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: .github/scripts/resolve-version.sh

  # NB: the Synology .spk + its GitHub Pages "package source" (stable + nightly)
  # live in their own workflow, .github/workflows/synology.yml.

  # Module .kmod bundles (one per build target) + the modules.json store catalog.
  modules:
    name: Modules
    needs: version
    if: ${{ needs.version.outputs.proceed == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","modules"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-modules.yml
    permissions:
      contents: write # passed down to the called workflow
    with:
      version: ${{ needs.version.outputs.version }}
      channel: ${{ needs.version.outputs.channel }}
      proceed: ${{ needs.version.outputs.proceed }}
    secrets: inherit

  # -------------------------------------------------------------------- TV ---

  # webOS .ipk + Tizen .wgt + Android TV .apk.
  tv:
    name: TV
    needs: version
    if: ${{ needs.version.outputs.proceed == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-tv.yml
    permissions:
      contents: write # passed down to the called workflow
    with:
      version: ${{ needs.version.outputs.version }}
      triplet: ${{ needs.version.outputs.triplet }}
      channel: ${{ needs.version.outputs.channel }}
      proceed: ${{ needs.version.outputs.proceed }}
    secrets: inherit

  # The fourth television, kept out of the job above because it ships to
  # TestFlight rather than to a file. It IS in the publish `needs` below: a
  # release is a statement that this version builds everywhere, and an .ipa that
  # never compiled is not something to find out about after the fact. Same
  # `targets: tv` selector as its siblings.
  appletv:
    name: Apple TV
    needs: version
    if: ${{ needs.version.outputs.proceed == 'true' && (contains(fromJSON('["stable","candidate"]'), needs.version.outputs.channel) || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-appletv.yml
    permissions:
      contents: read # passed down to the called workflow
    with:
      version: ${{ needs.version.outputs.version }}
      triplet: ${{ needs.version.outputs.triplet }}
      channel: ${{ needs.version.outputs.channel }}
      proceed: ${{ needs.version.outputs.proceed }}
    secrets: inherit

  # ---------------------------------------------------------------- Mobile ---

  # Firebase App Distribution + TestFlight. Present in the publish `needs` below
  # (a broken mobile build must not reach a tag), absent from publish-nightly's:
  # this job is stable-only, so on the nightly channel it is SKIPPED, and a
  # skipped dependency skips its dependents.
  mobile:
    name: Mobile
    needs: version
    if: ${{ needs.version.outputs.proceed == 'true' && (contains(fromJSON('["stable","candidate"]'), needs.version.outputs.channel) || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","mobile"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-mobile.yml
    permissions:
      contents: write # passed down to the called workflow
    with:
      version: ${{ needs.version.outputs.version }}
      triplet: ${{ needs.version.outputs.triplet }}
      channel: ${{ needs.version.outputs.channel }}
      proceed: ${{ needs.version.outputs.proceed }}
    secrets: inherit

  # --------------------------------------------------------------- Desktop ---

  # macOS .dmg + Windows .exe/.msi + Linux .AppImage/.deb.
  desktop:
    name: Desktop
    needs: version
    if: ${{ needs.version.outputs.proceed == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","desktop"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-desktop.yml
    permissions:
      contents: write # passed down to the called workflow
    with:
      version: ${{ needs.version.outputs.version }}
      channel: ${{ needs.version.outputs.channel }}
      proceed: ${{ needs.version.outputs.proceed }}
    secrets: inherit

  # ------------------------------------------------------------- Publish ---

  # Flip the draft release live ONLY once every artifact job has attached its
  # assets. This is what keeps `releases/latest/download/modules.json` (the
  # module Store's default registry URL) stable: without it, the new release
  # becomes "latest" the moment the FIRST job attaches, and the URL 404s until
  # the catalog lands (or forever, if a job fails mid-rollout). Publishing is
  # atomic: either the complete release goes live, or the previous one stays
  # "latest". A failed rollout leaves a draft to inspect/delete.
  #
  # `appletv` and `mobile` are in this list even though they attach nothing to
  # the Release. They used to be left out so an upload hiccup could not hold back
  # a server release, and the cost of that showed up in v0.1.34: both .ipa builds
  # failed and the Release went out anyway, green, with two platforms silently
  # broken. A tag is a claim that the version builds everywhere - so the gate
  # covers everywhere.
  #
  # This job no longer publishes anything; it is the CANDIDATE GATE. It reports
  # whether the run that just finished is fit to promote, and deploy.yml refuses
  # to promote a run whose gate did not pass. Publishing moved to deploy.yml so
  # that a broken pipeline costs a re-push rather than a version number.
  gate:
    name: Candidate gate
    needs: [version, modules, tv, desktop, appletv, mobile]
    if: needs.version.outputs.channel == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Every platform built
        run: |
          echo "::notice::Candidate ${{ needs.version.outputs.version }} is complete and promotable."
          echo "Promote it with: gh workflow run deploy.yml -f build_run_id=${{ github.run_id }}"

  # Nightly channel: gather EVERY artifact this run built and publish them onto
  # the rolling `nightly` prerelease - the same release the per-push canary .spk
  # (synology.yml) lives on, so one URL carries the whole nightly fleet. Old
  # installers are cleared first (the canary .spk pair is preserved), then the
  # new set + nightly-manifest.json (sha/version/date - also the no-new-commits
  # guard for the next scheduled run) go up. Plain `needs` = publish only when
  # every build succeeded, mirroring the stable draft-flip atomicity.
  publish-nightly:
    name: Publish the nightly prerelease
    needs: [version, modules, tv, desktop]
    if: needs.version.outputs.channel == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the Release
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history for the commit log in the release notes

      - name: Collect every artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Publish onto the rolling nightly release
        run: .github/scripts/publish-nightly.sh
