name: Build & Release

# Every push to main builds EVERY client artifact for the version
# server/Cargo.toml is currently on, and publishes NOTHING. deploy.yml promotes
# one of those runs to a Release behind an approval.
#
# It used to be the tag that triggered this, which meant a version number was
# spent to find out whether the pipeline worked. Two releases in a row were lost
# that way. Now a candidate can be rebuilt as many times as it takes - same
# version, new run - and the number is only claimed once something good exists
# to attach it to.
#
# It is also what makes the build fast enough to run on every push. GitHub scopes
# a cache to the ref that wrote it, and a tag gets its OWN scope, so releases
# never reused each other's caches: `No cache found`, ~2GB of Rust rebuilt from
# scratch every time. Building on main writes to refs/heads/main, which every
# later run can read.
#
# The artifact set:
#   - Synology .spk (server + web SPA + ffmpeg, x86_64 musl)
#   - Desktop installers (macOS .dmg, Windows .exe/.msi, Linux .AppImage/.deb)
#   - LG webOS .ipk - ONE package carrying BOTH tiers (modern Chrome 99+ AND the
#     legacy Chromium 53-94 bundle for 2018-2023 TVs, runtime-gated)
#   - Samsung Tizen .wgt (signed with a throwaway author certificate; TVs in
#     developer mode accept it)
#   - Android TV .apk (release-signed when the keystore secrets are set, else
#     debug-signed for sideloading)
#   - Apple TV .ipa, to TestFlight. Its own called workflow rather than a fourth
#     job in the TV one, because unlike the .ipk/.wgt/.apk it is not a file a
#     tester can sideload.
#   - Mobile .apk + .ipa, pushed to the two beta channels BETA.md points testers
#     at (Firebase App Distribution, TestFlight).
#
# Module .kmod bundles are NOT in that set: they release independently from
# .github/workflows/modules.yml.
#
# All bundles are PRODUCTION builds: `vite build`, console/debugger stripped by
# the shared TV shell factory, no KROMA_TV_DEVICE dev mode.
#
# Nothing here publishes a Release. What a push to main DOES publish is the
# canary channel: the `canary` job copies the installers a tester can sideload
# onto the rolling `canary` prerelease, under a dated version, where the site's
# archive and /download read them. The Synology .spk joins that same tag from
# synology.yml.
#
# Manual runs build artifacts without publishing a Release; `targets` scopes the
# run (all | spk | desktop | tv | mobile).
#
# The per-platform build jobs live in reusable workflows (_release-*.yml) that
# this file calls; the calling job here carries the SAME gate as the jobs it
# wraps, so a skipped platform still propagates a skip to the candidate gate -
# and deploy.yml refuses to promote a run whose gate did not pass.

on:
  push:
    branches: [main]
    # A candidate build only matters when it can change a promoted artifact.
    # Docs, the Cloudflare-hosted showcases (kit + site are in no release
    # artifact) and sibling workflows that build none of the fleet skip the
    # whole run. Promotion stays correct: deploy.yml takes an explicit run id,
    # and these paths change no promoted bytes. synology.yml is deliberately
    # NOT ignored - the .spk on a Release comes from the synology run at the
    # SAME sha as the candidate, so an .spk-pipeline change still needs a
    # candidate here to be promotable.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - 'apps/kit/**'
      - 'apps/www/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/kit.yml'
      - '.github/workflows/tv-web.yml'
      - '.github/workflows/repo-worker.yml'
      - '.github/workflows/site.yml'
      - '.github/workflows/desktop-autoupdate.yml'
      - '.github/workflows/apple-signing-doctor.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.0). Defaults to server/Cargo.toml.'
        required: false
      targets:
        description: 'What to build'
        type: choice
        options: [all, spk, desktop, tv, mobile, tools]
        default: all
        required: false
      distribute:
        description: 'Also push the mobile/TV builds to TestFlight + Firebase'
        type: boolean
        default: false
        required: false

# Candidates supersede.
#
# This used to queue unconditionally, because a superseded run could leave a
# partially-uploaded Release. That reason is gone: a candidate build publishes
# NOTHING - deploy.yml does - so the only thing a superseded candidate can lose
# is a result nobody wants any more. Queuing them cost real time; four pushes in
# an afternoon meant the fourth waited an hour behind three builds of code that
# had already been replaced.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # One version for every artifact: the tag, the manual input, or the
  # server/Cargo.toml base. `triplet` is the sanitized x.y.z the TV stores
  # require (appinfo.json / config.xml reject suffixes); `build` is the one
  # monotonic build number every store-bound package in this run carries.
  # Also decides the channel: stable tag, candidate, or build-only.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo and uploads run artifacts
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      triplet: ${{ steps.v.outputs.triplet }}
      channel: ${{ steps.v.outputs.channel }}
      build: ${{ steps.v.outputs.build }}
      canary: ${{ steps.v.outputs.canary }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile --filter '@kroma/ci-tools'
      - id: v
        run: bun run ci version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}

  # NB: the Synology .spk + its GitHub Pages "package source" (stable + canary)
  # live in their own workflow, .github/workflows/synology.yml. So do the module
  # .kmod bundles and the store catalog: modules release on their own
  # `<module-id>@<version>` tags from .github/workflows/modules.yml, on their own
  # cadence, so a module fix no longer waits for a server version to ship. A
  # server release therefore neither builds nor gates on them.

  # ----------------------------------------------------------------- TOOLS ---

  # `bun run tv` as a downloadable executable. Not a client, and not in the
  # candidate gate below: a television ships whether or not the tool that
  # installs it compiled.
  tools:
    name: Installer
    needs: version
    if: ${{ (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tools"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-tools.yml
    permissions:
      contents: write # passed down to the called workflow
    with:
      version: ${{ needs.version.outputs.version }}
      channel: ${{ needs.version.outputs.channel }}
    secrets: inherit

  # -------------------------------------------------------------------- TV ---

  # webOS .ipk + Tizen .wgt + Android TV .apk.
  tv:
    name: TV
    needs: version
    if: ${{ (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-tv.yml
    permissions:
      contents: write # passed down to the called workflow
    with:
      version: ${{ needs.version.outputs.version }}
      triplet: ${{ needs.version.outputs.triplet }}
      channel: ${{ needs.version.outputs.channel }}
      build: ${{ needs.version.outputs.build }}
    secrets: inherit

  # The fourth television, kept out of the job above because it ships to
  # TestFlight rather than to a file. It IS in the publish `needs` below: a
  # release is a statement that this version builds everywhere, and an .ipa that
  # never compiled is not something to find out about after the fact. Same
  # `targets: tv` selector as its siblings.
  appletv:
    name: Apple TV
    needs: version
    if: ${{ (contains(fromJSON('["stable","candidate"]'), needs.version.outputs.channel) || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","tv"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-appletv.yml
    permissions:
      contents: read # passed down to the called workflow
      actions: write # the DerivedData cache prune
    with:
      version: ${{ needs.version.outputs.version }}
      triplet: ${{ needs.version.outputs.triplet }}
      channel: ${{ needs.version.outputs.channel }}
      build: ${{ needs.version.outputs.build }}
    secrets: inherit

  # ---------------------------------------------------------------- Mobile ---

  # Firebase App Distribution + TestFlight. Present in the publish `needs` below:
  # a broken mobile build must not reach a tag.
  mobile:
    name: Mobile
    needs: version
    if: ${{ (contains(fromJSON('["stable","candidate"]'), needs.version.outputs.channel) || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","mobile"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-mobile.yml
    permissions:
      contents: write # passed down to the called workflow
      actions: write # the DerivedData cache prune
    with:
      version: ${{ needs.version.outputs.version }}
      triplet: ${{ needs.version.outputs.triplet }}
      channel: ${{ needs.version.outputs.channel }}
      build: ${{ needs.version.outputs.build }}
    secrets: inherit

  # --------------------------------------------------------------- Desktop ---

  # macOS .dmg + Windows .exe/.msi + Linux .AppImage/.deb.
  desktop:
    name: Desktop
    needs: version
    if: ${{ (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","desktop"]'), github.event.inputs.targets)) }}
    uses: ./.github/workflows/_release-desktop.yml
    permissions:
      contents: write # passed down to the called workflow
    with:
      version: ${{ needs.version.outputs.version }}
      channel: ${{ needs.version.outputs.channel }}
    secrets: inherit

  # ------------------------------------------------------------- Publish ---

  # Flip the draft release live ONLY once every artifact job has attached its
  # assets: without it, the new release becomes "latest" the moment the FIRST job
  # attaches, and every download URL under it 404s until the rest land (or
  # forever, if a job fails mid-rollout). Publishing is atomic: either the
  # complete release goes live, or the previous one stays "latest". A failed
  # rollout leaves a draft to inspect/delete.
  #
  # `appletv` and `mobile` are in this list even though they attach nothing to
  # the Release. They used to be left out so an upload hiccup could not hold back
  # a server release, and the cost of that showed up in v0.1.34: both .ipa builds
  # failed and the Release went out anyway, green, with two platforms silently
  # broken. A tag is a claim that the version builds everywhere - so the gate
  # covers everywhere.
  #
  # This job no longer publishes anything; it is the CANDIDATE GATE. It reports
  # whether the run that just finished is fit to promote, and deploy.yml refuses
  # to promote a run whose gate did not pass. Publishing moved to deploy.yml so
  # that a broken pipeline costs a re-push rather than a version number.
  gate:
    name: Candidate gate
    needs: [version, tv, desktop, appletv, mobile]
    if: needs.version.outputs.channel == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Every platform built
        run: |
          echo "::notice::Candidate ${{ needs.version.outputs.version }} is complete and promotable."
          echo "Promote it with: gh workflow run deploy.yml -f build_run_id=${{ github.run_id }}"

  # ---------------------------------------------------------------- Canary ---

  # The sideloadable half of what this push built, on the rolling `canary`
  # prerelease: Samsung, LG, Android TV, Android, and the three desktop
  # installers. Not the two .ipa bundles (TestFlight is the only way onto an
  # Apple device) and not a gate: a canary that fails to upload must not make a
  # candidate look unpromotable. The files keep the candidate's bytes and take a
  # dated version in their name, so two pushes of 0.1.39 stay two builds;
  # `bun run ci canary` retires what is older than two weeks past the newest
  # five of each kind. apps/www reads this tag into /download/archive.
  canary:
    name: Canary channel
    needs: [version, tv, desktop, mobile]
    if: >-
      !cancelled()
      && needs.version.outputs.channel == 'candidate'
      && needs.tv.result == 'success'
      && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile --filter '@kroma/ci-tools'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kroma-{tizen-wgt,webos-ipk,androidtv-apk,mobile-apk,desktop-macos,desktop-windows,desktop-linux}
          path: canary
          merge-multiple: true
      - run: |
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find canary -type f -print0)
          bun run ci canary publish --rename \
            --triplet "${{ needs.version.outputs.triplet }}" \
            --version "${{ needs.version.outputs.canary }}" \
            "${files[@]}"
