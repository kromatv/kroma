name: Sonar

# CI-based SonarCloud analysis (config in sonar-project.properties at the repo
# root). Uploads JS/TS coverage (vitest -> lcov) and, best-effort, Rust coverage
# (cargo-llvm-cov -> lcov).
#
# ACTIVATION: the scan job self-skips (clean, not failed) until a `SONAR_TOKEN`
# repository secret exists. You must ALSO turn OFF "Automatic Analysis" in
# SonarCloud (Administration > Analysis Method) - SonarCloud rejects a CI scan
# while Automatic Analysis owns the branch.

# Docs-only changes carry no analyzable code and no coverage delta; skip the
# scan (SonarCloud's gate is not a required check, so nothing blocks).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.14'

jobs:
  # Gate: only run the (costly) scan once SONAR_TOKEN is configured. Secrets can't
  # be read in a job-level `if`, so a tiny job exposes it as an output instead.
  gate:
    name: Check SONAR_TOKEN
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN secret not set - skipping SonarCloud scan."
          fi

  sonar:
    name: SonarCloud scan
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: Sonar needs it for blame / accurate new-code detection.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: JS/TS coverage (vitest -> coverage/lcov.info)
        # NOT continue-on-error. It used to be, on the assumption that vitest
        # still writes a usable lcov when a test fails - it does not. A single
        # failing test left the report missing most of its files, every TS file
        # scored 0%, and the project's coverage "dropped" ten points with a green
        # Sonar job to explain it. Failing here is safe precisely because tests
        # are hard-gated in ci.yml: a failure at this point means the lcov cannot
        # be trusted, and no measurement beats a wrong one.
        run: bun run test:coverage

      # --- Rust coverage (best-effort; never blocks the scan) -----------------
      # main pushes always measure Rust; PRs only when they actually touch Rust
      # (the instrumented workspace build is ~10 min, the bulk of this job).
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: rustchanges
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'server/**'
              # Modules are their own cargo workspaces at the repo root, so
              # `server/**` does not cover them and their Rust would otherwise
              # never be measured on a module-only PR.
              - 'modules/**'
              # kroma-engine include_str!s these catalogs at compile time.
              - 'packages/core/src/locales/**'

      # Single gate the Rust steps below share: always on main, on PRs only when
      # Rust actually changed.
      - id: rustgate
        env:
          RUN: ${{ github.event_name != 'pull_request' || steps.rustchanges.outputs.rust == 'true' }}
        run: echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: steps.rustgate.outputs.run == 'true'
        with:
          components: llvm-tools-preview

      # Its own stable entry: llvm-cov builds with -C instrument-coverage, so
      # these artifacts can't be shared with ci.yml's plain test build. Saved
      # from main only (see ci.yml for the quota rationale) - without this the
      # instrumented tree was re-uploaded per PR AND evicted before reuse, so
      # every scan paid a ~10 min cold build.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.rustgate.outputs.run == 'true'
        with:
          workspaces: server
          # The module workspaces' instrumented artifacts (they build into the
          # shared target/kmod dir; see @kroma/module-tools).
          cache-directories: ${{ github.workspace }}/target/kmod
          shared-key: server-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        if: steps.rustgate.outputs.run == 'true'
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage (cargo-llvm-cov -> server/lcov.info)
        # Skipped on PRs that touch no Rust: Sonar's gate scores NEW code, and a
        # frontend-only PR adds no Rust lines to cover. main always runs it, so
        # the branch-level Rust coverage figure never drifts.
        if: steps.rustgate.outputs.run == 'true'
        working-directory: server
        continue-on-error: true
        # Capped so a cold instrumented build of the big server workspace
        # (candle/librqbit/whisper) can never blow the job budget; the scan then
        # proceeds with JS/TS coverage only.
        timeout-minutes: 25
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # `--workspace` above stops at server/: modules are their own workspaces
      # now, so without this every modules/** source Sonar still analyses reports
      # 0% (scene, torznab, mdns, the engines and the un-excluded half of indexer
      # / acquisition / vector — see sonar.coverage.exclusions). lcov records are
      # self-contained, so appending each module's report to the server's is a
      # valid single report. Its own step and budget: if the module half runs
      # long it must not take the server's coverage down with it.
      - name: Rust coverage (modules, appended to server/lcov.info)
        if: steps.rustgate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          # Not `set -e`: a module that fails to instrument must still leave the
          # ones that succeeded (and the server's own report) in place.
          bun run modules cargo llvm-cov --lcov --output-path lcov.info || true
          for f in modules/*/server/lcov.info; do
            if [ -s "$f" ]; then cat "$f" >> server/lcov.info; fi
          done
          echo "lcov records: $(grep -c '^SF:' server/lcov.info || true)"

      # --- Analysis -----------------------------------------------------------
      # The scanner follows symlinks while indexing, and bun leaves a symlink
      # farm in every workspace's node_modules pointing back into the root
      # store - so the walk re-entered the root node_modules once per workspace
      # (5.5M files, 7+ min of preprocessing). Everything that needs those links
      # (install, coverage) has already run, and the analyzers resolve imports
      # through the root node_modules, which stays intact.
      - name: Prune workspace node_modules symlinks (scan walk)
        run: find clients modules packages -path '*node_modules*' -type l -delete

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
