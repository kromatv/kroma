name: Quality report

# A weekly measurement, not a gate. CRAP per function and structural
# duplication over the tracked sources, scored against the TypeScript coverage
# this run produces, uploaded as an artifact and printed on the run page. It
# runs on no pull request and passes whatever the scores are; docs/quality.md
# says what each number means and what this run cannot see.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1' # Monday 04:30 UTC

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  report:
    name: Quality report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run quality:setup
      # The two projects CI measures (packages/ci-tools/src/test.ts says why
      # the audit project is left out). A failing test is the gate's to report,
      # not this job's: the lcov is written all the same and the report reads it.
      - name: TypeScript coverage
        continue-on-error: true
        run: bun run test:coverage --project web --project native --coverage.reportOnFailure
      - run: bun run quality:report
      - name: Summary on the run page
        if: ${{ !cancelled() }}
        run: cat .metrics/summary.md >> "$GITHUB_STEP_SUMMARY"
      # A dot-directory: without include-hidden-files the upload finds nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: quality-report
          path: .metrics/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
