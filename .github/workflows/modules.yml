name: Modules

# The module release train. Every module is a WebAssembly component, built once
# for wasm32-wasip2 into one `<id>.kmod` that installs on every platform, and
# released on its own tag, `<module-id>@<version>`.
#
# `kroma release` compares each packed bundle with the live catalog: a bumped
# version publishes, identical bytes are left as they are, and bytes that moved
# under a version that did not are named in the run and left unpublished.
#
# What publishing produces:
#   <module-id>@<version>   one prerelease per module, holding its .kmod and
#                           .sha256
#   modules                 a rolling prerelease holding modules.json, the
#                           newest release of every module, and history.json,
#                           what every version ever released needs. This is
#                           what https://modules.kroma.tv serves and what the
#                           in-app Store browses.

on:
  push:
    branches: [main]
    paths:
      # A module's own tree, and everything a module bundle is built out of: the
      # SDK/runtime crates it links, the packing and catalog tooling, the pinned
      # toolchain. A change to any of those can move a bundle's bytes, and the
      # content-hash gate is what decides whether it actually did.
      - 'modules/**'
      - 'server/crates/kroma-module-*/**'
      - 'packages/cli/**'
      - 'packages/module-sdk/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/modules.yml'
      - '.github/scripts/publish-modules.sh'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide and print, publish nothing'
        type: boolean
        default: false
        required: false

# Publishing mutates the shared catalog release, so two runs must not interleave:
# the second would rebuild modules.json from a catalog the first had not finished
# writing. Queue rather than cancel - a cancelled run can leave per-module
# releases cut but absent from the catalog.
concurrency:
  group: modules-registry
  cancel-in-progress: false

jobs:
  # Every module's component and frontend, packed into dist/modules.
  modules:
    name: Modules (.kmod)
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo and uploads run artifacts
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the pinned toolchain and the component target
        run: |
          cargo --version
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            server
            . -> target/kmod
          key: kmod

      - name: Build and pack every module
        run: bun run kroma build

      - name: Upload .kmod artifacts (+ checksums)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-modules
          path: dist/modules/*.kmod*
          if-no-files-found: error

  # Decide, then publish. `kroma release` compares every packed bundle against
  # the live catalog and answers per module: publish under a new tag, skip
  # identical bytes, or leave out a module whose bytes moved under the same
  # version. A build that failed publishes nothing, and the previous catalog
  # keeps serving.
  publish:
    name: Publish the module releases
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      contents: write # cut per-module releases, refresh the catalog release
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      # `kroma release` reads the registry contract (`@kromatv/registry`) to
      # order versions, so this job needs the workspace links like any other.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Collect the bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kroma-modules
          path: dist/modules

      # Adds every module release the published history does not describe yet,
      # reading each one's manifest at its tag. The first run builds the history;
      # every later run finds nothing missing, or repairs what was lost.
      - name: Repair the version history
        run: bun run ci modules-history --out dist/registry/history.json

      # Reads the live catalog off the registry worker (its default), so the
      # comparison is against what servers are actually being served - not
      # against a release asset that may have been superseded.
      - name: Decide what to publish
        run: bun run kroma release --repo "$GH_REPO" --published-history dist/registry/history.json

      - name: Show the plan
        run: |
          echo '### Module release plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/registry/plan.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Cut the releases + refresh the catalog
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: .github/scripts/publish-modules.sh

      - name: Upload the catalog as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kroma-modules-registry
          path: |
            dist/registry/modules.json
            dist/registry/history.json
            dist/registry/plan.json
          if-no-files-found: error
