name: Package-source worker

# Deploys the Cloudflare Workers that back the KROMA package + module sources:
#   apps/packages  -> packages.kroma.tv  (kroma-packages)
#   apps/modules  -> modules.kroma.tv  (kroma-modules)
# Only when the worker code changes; releases never touch these (they read the
# GitHub Releases API live). Each worker is gated SEPARATELY: a push that
# touches one does not redeploy the others (a dispatch still ships all three).
#
# Needs the CLOUDFLARE_API_TOKEN repo secret (Workers Scripts: Edit). WITHOUT it
# the job SKIPS the deploys with a notice instead of failing red - the workers
# can always be deployed by hand with `bunx wrangler deploy`.
on:
  push:
    branches: [main]
    paths:
      - 'apps/packages/**'
      - 'apps/modules/**'
      # The registry worker builds the RFC 110 documents with this.
      - 'packages/registry/**'
      - '.github/workflows/repo-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Which worker actually changed. Push only: on a dispatch the outputs
      # stay empty and both deploy steps treat that as "go".
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: f
        if: github.event_name == 'push'
        with:
          filters: |
            packages_worker:
              - 'apps/packages/**'
              - '.github/workflows/repo-worker.yml'
            modules_worker:
              - 'apps/modules/**'
              - 'packages/registry/**'
              - '.github/workflows/repo-worker.yml'

      # Soft gate: no token -> skip (not fail). secrets can't be read in a job-
      # level if, so surface it as a step output the deploy steps depend on.
      - name: Check for the Cloudflare token
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping worker deploys (deploy by hand with 'bunx wrangler deploy')."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.guard.outputs.has_token == 'true'
        with:
          bun-version: '1.3.14'

      # Both are SSR apps now: `deploy` builds the client + server bundles first,
      # and wrangler serves the handler with the client assets beside it.
      - name: Install dependencies
        if: steps.guard.outputs.has_token == 'true'
        run: bun install --frozen-lockfile

      - name: Deploy the package source (packages.kroma.tv)
        if: steps.guard.outputs.has_token == 'true' && steps.f.outputs.packages_worker != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy:packages

      - name: Deploy the module registry (modules.kroma.tv)
        if: steps.guard.outputs.has_token == 'true' && steps.f.outputs.modules_worker != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy:modules

