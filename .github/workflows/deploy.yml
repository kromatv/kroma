name: Deploy

# Promote an already-built candidate to a published Release.
#
# Nothing is COMPILED here. Every push to main runs "Build & Release", which
# builds the full artifact fleet for whatever version server/Cargo.toml is on
# and uploads it. This workflow takes one of those runs, waits for a human to
# approve it, and publishes those exact bytes under a tag.
#
# The point is that a version number is no longer spent by pressing the button.
# A tag used to BE the trigger, so every pipeline bug - a missing profile, a
# stale cache, a typo in a workflow - burned a version and needed a new one to
# retry. Now: fix, push to main, main rebuilds the same version, promote when
# the candidate is actually good.
#
# The approval is a GitHub Environment (`production`) with a required reviewer.
# The job below sits in "Waiting" until it is approved from the run page, and a
# rejection leaves the tag uncreated and the release unpublished.
#
#   gh workflow run deploy.yml -f build_run_id=<id>
#
# `build_run_id` is a "Build & Release" run whose Candidate gate passed - that
# gate only exists when every platform built, so a run with a failed .ipa cannot
# be promoted. The Synology .spk comes from the synology.yml run for the SAME
# commit, resolved automatically.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build & Release run to promote (must have a green Candidate gate).'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease (not marked latest).'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a half-uploaded release

jobs:
  # Everything that can be checked WITHOUT the approver's time is checked here,
  # before the environment gate, so a rejected promotion is rejected for a real
  # reason rather than a typo in the run id.
  verify:
    name: Verify the candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the build run + its artifacts
      contents: read
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      synology_run: ${{ steps.check.outputs.synology_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: check
        name: The run is green, complete, and on main
        run: .github/scripts/verify-candidate.sh

  # The approval gate. `environment:` is what makes GitHub pause here; the
  # protection rule on `production` names the reviewer. Everything below the
  # gate is upload + publish, which is why a deploy is a couple of minutes
  # rather than the twenty a rebuild costs.
  publish:
    name: Publish the Release
    needs: verify
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.verify.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the candidate's artifacts
      contents: write # create the tag + the Release
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history for the release notes

      # `merge-multiple` flattens every per-platform artifact into one directory,
      # which is the shape the Release wants. Same call the nightly publisher
      # makes, pointed at another run.
      - name: Collect the candidate's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Collect the Synology .spk
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
          name: kroma-synology-spk
          run-id: ${{ needs.verify.outputs.synology_run }}
          github-token: ${{ github.token }}

      - name: Tag the commit and publish
        run: .github/scripts/deploy-release.sh

  # Shipping to testers is a DEPLOY act, not a build one - which is the whole
  # reason candidates do not do it. But moving publishing out of release.yml
  # left distribution on no path at all: the candidate skips it because it is
  # not `stable`, and this workflow did not do it either. v0.1.35 published
  # correctly signed .ipa files for both platforms and uploaded neither.
  #
  # No `environment:` here deliberately. It runs only after `publish`, which a
  # human already approved, so a second prompt would ask the same question
  # twice. Failing here leaves the Release published and the beta channels
  # behind - recoverable by re-running, and better than blocking a release on
  # Apple's upload service.
  distribute:
    name: Push to the beta channels
    needs: [verify, publish]
    runs-on: macos-26 # xcrun altool
    permissions:
      actions: read # download the candidate's artifacts
      contents: read
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The SAME artifacts the Release carries, from the same run - so what
      # testers install is what was gated and approved, not a rebuild.
      - name: Collect the mobile and Apple TV builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
          pattern: kroma-{mobile,appletv}-*
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Upload the iPhone build to TestFlight
        env:
          IPA: dist/KROMA-mobile-${{ needs.verify.outputs.version }}.ipa
          PLATFORM: ios
        run: .github/scripts/upload-to-testflight.sh

      - name: Upload the Apple TV build to TestFlight
        env:
          IPA: dist/KROMA-appletv-${{ needs.verify.outputs.version }}.ipa
          PLATFORM: tvos
        run: .github/scripts/upload-to-testflight.sh

      # Android has no TestFlight equivalent; BETA.md points testers at Firebase
      # App Distribution. Absent credentials skip rather than fail, same as the
      # Apple half.
      - name: Distribute the Android build to Firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
        run: |
          set -euo pipefail
          APK="dist/KROMA-mobile-${VERSION}.apk"
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No Firebase credentials; $APK is attached to the Release but not pushed."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-sa.json"' EXIT
          npx --yes firebase-tools appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file clients/mobile/distribution/release-notes.txt \
            --groups "$FIREBASE_TESTER_GROUPS"
